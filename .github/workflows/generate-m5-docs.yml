name: Generate M5 docs

on:
  push:
    branches:
      - m5-build-strict
    paths:
      - 'M05/TEORIA/M05_TEORIA.md'
      - 'M05/PRACTICA/M05_PRACTICA.md'
      - 'scripts/generate_m5_pdfs.py'
      - 'scripts/generate_m5_theory_pdf.py'
      - 'scripts/generate_m5_practice_pdf.py'
      - 'scripts/audit_m5_pdf_pages.py'
      - 'scripts/render_m5_pdf_pages.py'
      - '.github/workflows/generate-m5-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mistune beautifulsoup4 pygments weasyprint pypdf pymupdf

      - name: Generate M5 PDFs
        run: python scripts/generate_m5_pdfs.py

      - name: Audit every PDF page
        run: python scripts/audit_m5_pdf_pages.py

      - name: Render every PDF page
        run: python scripts/render_m5_pdf_pages.py

      - name: Publish regenerated PDFs when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M05/TEORIA/M05_TEORIA.pdf M05/PRACTICA/M05_PRACTICA.pdf
          if git diff --cached --quiet; then
            echo "Los PDF publicados ya coinciden con los Markdown."
          else
            git commit -m "docs(m5): regenerar pdf desde markdown"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
