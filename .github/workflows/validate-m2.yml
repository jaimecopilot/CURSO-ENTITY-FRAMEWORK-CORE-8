name: Validate M2

on:
  push:
    branches: [ main ]
    paths:
      - 'M02/**'
      - 'scripts/audit_m2_traceability.py'
      - 'scripts/generate_m2_pdfs.py'
      - 'scripts/audit_m2_pdf_pages.py'
      - '.github/workflows/validate-m2.yml'
  workflow_dispatch:

concurrency:
  group: validate-m2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-m2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF CLI
        shell: pwsh
        run: dotnet tool install --global dotnet-ef --version 8.0.31

      - name: Audit cumulative structure
        run: python scripts/audit_m2_traceability.py

      - name: Build solutions 2.1 to 2.11
        shell: pwsh
        run: |
          foreach ($n in 1..11) {
            $d = "M02/PROYECTO/2.$n"
            Write-Host "== BUILD 2.$n =="
            dotnet restore "$d/AceriaData.sln"
            dotnet build "$d/AceriaData.sln" --configuration Release --no-restore
          }

      - name: Validate advanced migrations at 2.11
        shell: pwsh
        working-directory: M02/PROYECTO/2.11
        run: |
          $list = dotnet ef migrations list --no-build --configuration Release | Out-String
          $list
          if ($list -notmatch 'M2_2_11') { throw '2.11 no aparece en migrations list' }
          dotnet ef database update --no-build --configuration Release
          dotnet ef database update 20260927204833_M2_2_10 --no-build --configuration Release
          dotnet ef database update --no-build --configuration Release
          dotnet ef migrations script 20260927204833_M2_2_10 20260927204841_M2_2_11 --idempotent --no-build --configuration Release --output softdelete-idempotent.sql
          if (-not (Test-Path softdelete-idempotent.sql)) { throw 'No se generó el script idempotente 2.11' }
          $sql = Get-Content softdelete-idempotent.sql -Raw
          @('__EFMigrationsHistory','IsDeleted','DeletedAt') | ForEach-Object {
            if ($sql -notmatch $_) { throw "Script 2.11 incompleto: falta $_" }
          }

      - name: Run states 2.1 to 2.11 against LocalDB
        shell: pwsh
        run: |
          foreach ($n in 1..11) {
            $d = "M02/PROYECTO/2.$n"
            Write-Host "== RUN 2.$n =="
            dotnet run --project "$d/AceriaData.Console.csproj" --configuration Release --no-build
          }

      - name: Validate final Clean Architecture solution
        shell: pwsh
        working-directory: M02/PROYECTO/2.12
        run: |
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release --no-restore
          dotnet ef migrations list --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console
          dotnet run --project src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build

      - name: Validate documentation structure
        shell: pwsh
        run: |
          $theory = Get-Content M02/TEORIA/M02_TEORIA.md -Raw
          $practice = Get-Content M02/PRACTICA/M02_PRACTICA.md -Raw
          $theoryPoints = ([regex]::Matches($theory, '(?m)^## Punto 2\.\d+')).Count
          $practicePoints = ([regex]::Matches($practice, '(?m)^## Punto 2\.\d+')).Count
          if ($theoryPoints -ne 12) { throw "Teoría: se esperaban 12 puntos y hay $theoryPoints" }
          if ($practicePoints -ne 12) { throw "Práctica: se esperaban 12 puntos y hay $practicePoints" }
          @('The user wants','We need to','Let me think','Esperando confirmación para continuar','material fuente','corrección técnica:') | ForEach-Object {
            if ($theory.Contains($_) -or $practice.Contains($_)) { throw "Metacontenido detectado: $_" }
          }
          @('Punto 2.10','Filtros globales','Punto 2.11','Migraciones en el modelado','Soft Delete','--idempotent','ModelSnapshot','Punto 2.12','Arquitectura Hexagonal') | ForEach-Object {
            if (-not $theory.Contains($_) -or -not $practice.Contains($_)) { throw "Falta contenido docente: $_" }
          }

      - name: Verify expected E2E markers
        shell: pwsh
        run: |
          $checks = @{
            "M02/PROYECTO/2.3/Program.cs" = "2.3 OK"
            "M02/PROYECTO/2.4/Program.cs" = "2.4 OK"
            "M02/PROYECTO/2.5/Program.cs" = "2.5 OK"
            "M02/PROYECTO/2.10/Program.cs" = "2.10 OK"
            "M02/PROYECTO/2.11/Program.cs" = "2.11 OK"
            "M02/PROYECTO/2.12/src/AceriaData.Console/Program.cs" = "2.12 OK"
          }
          foreach ($p in $checks.Keys) {
            $content = Get-Content $p -Raw
            if (-not $content.Contains($checks[$p])) { throw "Falta marcador E2E en $p" }
          }


  publish-m2-pdfs:
    needs: validate-m2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: pip install mistune beautifulsoup4 pygments weasyprint pypdf pymupdf

      - name: Generate M2 PDFs
        run: python scripts/generate_m2_pdfs.py

      - name: Audit every M2 PDF page
        run: python scripts/audit_m2_pdf_pages.py

      - name: Upload PDFs for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: M02-PDF-QA
          path: |
            M02/TEORIA/M02_TEORIA.pdf
            M02/PRACTICA/M02_PRACTICA.pdf
          if-no-files-found: error
          retention-days: 3

      - name: Commit validated M2 PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M02/TEORIA/M02_TEORIA.pdf M02/PRACTICA/M02_PRACTICA.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged."
            exit 0
          fi
          git commit -m "docs: publicar PDFs validados de M2"
          git pull --rebase
          git push
