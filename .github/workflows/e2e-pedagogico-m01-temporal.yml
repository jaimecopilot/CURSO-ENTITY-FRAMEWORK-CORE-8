name: E2E pedagógico M01

on:
  workflow_dispatch:
  push:
    branches:
      - final/integracion-m01
    paths:
      - .github/workflows/e2e-pedagogico-m01-temporal.yml
      - .github/scripts/PedagogicalHarness.psm1
      - .github/scripts/Test-M01.ps1
      - .github/scripts/Test-M01Canonical.ps1
      - M01/PRACTICA/M01_PRACTICA_CANONICA.md
      - M01/PROYECTO/**

permissions:
  contents: read

concurrency:
  group: m01-pedagogico-fix-e2e-pedagogico-m01
  cancel-in-progress: true

jobs:
  m01_actual:
    name: M01 · canónico + 1.1–1.12 · PDF → código → E2E
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core 8 y SQL Server LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool update --global dotnet-ef --version 8.0.31
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global dotnet-ef --version 8.0.31
          }
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo instalar dotnet-ef 8.0.31."
          }

          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo iniciar SQL Server LocalDB."
          }

      - name: Validar contrato canónico M01 → bloques comentados
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./.github/scripts/Test-M01Canonical.ps1

      - name: Validar checkpoints funcionales 1.1–1.12
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./.github/scripts/Test-M01.ps1 -Suite all
