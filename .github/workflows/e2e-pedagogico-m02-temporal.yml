          )

          foreach ($token in $tokens) {
            if (-not $program.Contains($token)) {
              throw "2.8 no contiene el elemento exigido por el PDF: $token"
            }
          }

          if ($program.Contains("HasIndex(")) {
            throw "2.8 adelanta índices reservados a 2.9."
          }

          if (-not $program.Contains("RETO 2.8 - NUMEROORDEN DUPLICADO")) {
            throw "2.8 no conserva como código comentado el reto de unicidad."
          }

      - name: Reconstruir M2_2_8 desde 2.7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
