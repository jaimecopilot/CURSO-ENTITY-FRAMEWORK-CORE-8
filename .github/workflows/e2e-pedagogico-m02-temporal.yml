            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }
          if ($generated.Count -ne 1) {
            throw "La reconstrucción no produjo una única M2_2_8."
          }

          $migrationText = Get-Content $generated[0].FullName -Raw
          foreach ($token in @(
            "AddUniqueConstraint",
            "AK_OrdenesFabricacion_NumeroOrden",
            "AK_Aleaciones_Codigo",
            "AK_CertificadosCalidad_NumeroCertificado"
          )) {
            if (-not $migrationText.Contains($token)) {
              throw "M2_2_8 reconstruida no contiene $token."
            }
          }

