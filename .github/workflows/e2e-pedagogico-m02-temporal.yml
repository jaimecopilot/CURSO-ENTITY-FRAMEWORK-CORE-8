          if ($migration.Count -ne 1) {
            $issues.Add("2.10 debe contener exactamente una migración M2_2_10.")
          }
          else {
            $designer = [System.IO.Path]::ChangeExtension($migration[0].FullName, ".Designer.cs")
            if (-not (Test-Path $designer)) {
              $issues.Add("La migración M2_2_10 no tiene Designer.cs.")
            }
          }

          $program = Get-Content "M02/PROYECTO/2.10/Program.cs" -Raw
          foreach ($token in @(
            'entity.HasQueryFilter(o => o.Estado != "Cancelada")',
            'entity.HasQueryFilter(x => x.Activa)',
            'entity.HasQueryFilter(e => e.Activo)',
            'entity.HasQueryFilter(x => x.EstadoRelacion == "Activa")',
            'IgnoreQueryFilters()',
            '2.10 OK'
          )) {
            if (-not $program.Contains($token)) {
              $issues.Add("2.10 no contiene el elemento exigido por el PDF: $token")
            }
          }

          if ($program.Contains("IsDeleted") -or $program.Contains("DeletedAt")) {
            $issues.Add("2.10 adelanta propiedades de Soft Delete reservadas a 2.11.")
          }

          if (-not $program.Contains("RETO 2.10 - ORDEN CANCELADA E IGNOREQUERYFILTERS")) {
            $issues.Add("2.10 no conserva como código comentado el reto de orden Cancelada e IgnoreQueryFilters.")
          }

          if ($issues.Count -gt 0) {
            throw ("Auditoría 2.10 detectó:" + [Environment]::NewLine + " - " + ($issues -join ([Environment]::NewLine + " - ")))
          }

      - name: Reconstruir M2_2_10 desde 2.9
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.10-rebuild"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }

          Copy-Item "M02/PROYECTO/2.9" $temp -Recurse
          Copy-Item "M02/PROYECTO/2.10/Program.cs" (Join-Path $temp "Program.cs") -Force

          Set-Location $temp
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          dotnet ef migrations add M2_2_10 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "No se puede generar M2_2_10 partiendo de 2.9."
          }

          $generated = Get-ChildItem "Migrations" -Filter "*_M2_2_10.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }

          if ($generated.Count -ne 1) {
            throw "La reconstrucción no produjo una única M2_2_10."
          }

          $migrationText = Get-Content $generated[0].FullName -Raw
          foreach ($schemaOperation in @(
            "CreateTable(",
            "DropTable(",
            "AddColumn(",
            "DropColumn(",
            "AlterColumn(",
            "CreateIndex(",
            "DropIndex(",
            "AddForeignKey(",
            "DropForeignKey(",
            "AddUniqueConstraint(",
            "AddCheckConstraint("
          )) {
            if ($migrationText.Contains($schemaOperation)) {
              throw "M2_2_10 modifica el esquema aunque el PDF introduce únicamente filtros globales: $schemaOperation"
            }
          }

          $designer = [System.IO.Path]::ChangeExtension($generated[0].FullName, ".Designer.cs")
          if (-not (Test-Path $designer)) {
            throw "La migración reconstruida M2_2_10 no genera Designer.cs."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El estado reconstruido 2.10 deja cambios de modelo pendientes."
          }

      - name: Validar y ejecutar checkpoint 2.10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.10"

          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --configuration Release
          if (($list | Out-String) -notmatch "M2_2_10") {
            throw "El checkpoint 2.10 no reconoce M2_2_10."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El checkpoint 2.10 tiene cambios de modelo pendientes."
          }

          dotnet ef database update --configuration Release

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución de 2.10 falla." }

          $text = $output | Out-String
          foreach ($token in @(
            "2.10 OK",
            "Visibles: 1",
            "Sin filtro: 2"
          )) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.10 no demuestra el resultado esperado: $token"
            }
          }

      - name: Ejecutar reto Orden Cancelada e IgnoreQueryFilters
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "M02/PROYECTO/2.10"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.10-reto"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item $source $temp -Recurse

          $programPath = Join-Path $temp "Program.cs"
          $program = Get-Content $programPath -Raw
          $pattern = '(?ms)/\*\s*// RETO 2\.10 - ORDEN CANCELADA E IGNOREQUERYFILTERS\s*(.*?)\s*\*/'

          if ($program -notmatch $pattern) {
            throw "No existe el bloque comentado del reto 2.10."
          }

          $variant = [regex]::Replace($program, $pattern, '$1', 1)
          Set-Content $programPath -Value $variant -Encoding utf8

          Set-Location $temp
          dotnet build AceriaData.Console.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.10 no compila." }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.10 no se ejecuta." }

          $text = $output | Out-String
          foreach ($token in @(
            "Reto 2.10",
            "Visibles: 1",
            "Sin filtro: 3"
          )) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "El reto 2.10 no demuestra el filtrado esperado: $token"
            }
          }


  m02_2_11:
    name: M02 2.11 desde el PDF
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core y LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global dotnet-ef --version 8.0.31
          sqllocaldb start MSSQLLocalDB

      - name: Auditar continuidad y contrato PDF de 2.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $issues = [System.Collections.Generic.List[string]]::new()

          foreach ($relative in @(
            "AceriaData.sln",
            "AceriaData.Console.csproj",
            "AceriaDesignTimeDbContextFactory.cs",
            "appsettings.json"
          )) {
            $previous = Join-Path "M02/PROYECTO/2.10" $relative
            $current = Join-Path "M02/PROYECTO/2.11" $relative

            if (-not (Test-Path $current)) {
              $issues.Add("2.11 no conserva el archivo heredado de 2.10: $relative")
              continue
            }

            if ((Get-FileHash $previous).Hash -ne (Get-FileHash $current).Hash) {
              $issues.Add("2.11 modifica sin documentarlo un archivo heredado de 2.10: $relative")
            }
          }

          $previousMigrations = Get-ChildItem "M02/PROYECTO/2.10/Migrations" -File |
            Where-Object { $_.Name -ne "AceriaDbContextModelSnapshot.cs" }

          foreach ($file in $previousMigrations) {
            $current = Join-Path "M02/PROYECTO/2.11/Migrations" $file.Name
            if (-not (Test-Path $current)) {
              $issues.Add("2.11 no conserva la migración heredada $($file.Name).")
              continue
            }

            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $current).Hash) {
              $issues.Add("2.11 altera la migración heredada $($file.Name).")
            }
          }

          $migration = Get-ChildItem "M02/PROYECTO/2.11/Migrations" -Filter "*_M2_2_11.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }

          if ($migration.Count -ne 1) {
            $issues.Add("2.11 debe contener exactamente una migración M2_2_11.")
          }
          else {
            $designer = [System.IO.Path]::ChangeExtension($migration[0].FullName, ".Designer.cs")
            if (-not (Test-Path $designer)) {
              $issues.Add("La migración M2_2_11 no tiene Designer.cs.")
            }
          }

          $program = Get-Content "M02/PROYECTO/2.11/Program.cs" -Raw
          foreach ($token in @(
            "public bool IsDeleted { get; set; }",
            "public DateTime? DeletedAt { get; set; }",
            'entity.HasQueryFilter(o => !o.IsDeleted && o.Estado != "Cancelada")',
            'entity.HasQueryFilter(x => !x.IsDeleted && x.Activa)',
            'entity.HasQueryFilter(a => !a.IsDeleted)',
            'entity.HasQueryFilter(e => !e.IsDeleted && e.Activo)',
            "void EliminarLogicamente(int id)",
            "void Restaurar(int id)",
            "IgnoreQueryFilters()",
            "2.11 OK"
          )) {
            if (-not $program.Contains($token)) {
              $issues.Add("2.11 no contiene el elemento exigido por el PDF: $token")
            }
          }

          foreach ($className in @("OrdenFabricacion","PlanchaAcero","Aleacion","EstadoOrden")) {
            $pattern = "(?ms)public class $className.*?public bool IsDeleted \{ get; set; \}.*?public DateTime\? DeletedAt \{ get; set; \}"
            if ($program -notmatch $pattern) {
              $issues.Add("2.11 no incorpora IsDeleted/DeletedAt en $className.")
            }
          }

          $readme = Get-Content "M02/PROYECTO/2.11/README.md" -Raw
          foreach ($token in @(
            "__EFMigrationsHistory",
            "migrations remove",
            "dotnet ef migrations script 20260927204833_M2_2_10 20260927204841_M2_2_11 --configuration Release --output softdelete.sql",
            "dotnet ef migrations script --idempotent --configuration Release --output migraciones_idempotentes.sql"
          )) {
            if (-not $readme.Contains($token)) {
              $issues.Add("2.11 no conserva en el checkpoint el comando/concepto del reto del PDF: $token")
            }
          }

          if ($issues.Count -gt 0) {
            throw ("Auditoría 2.11 detectó:" + [Environment]::NewLine + " - " + ($issues -join ([Environment]::NewLine + " - ")))
          }

      - name: Reconstruir M2_2_11 desde 2.10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.11-rebuild"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }

          Copy-Item "M02/PROYECTO/2.10" $temp -Recurse
          Copy-Item "M02/PROYECTO/2.11/Program.cs" (Join-Path $temp "Program.cs") -Force

          Set-Location $temp
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          dotnet ef migrations add M2_2_11 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "No se puede generar M2_2_11 partiendo de 2.10."
          }

          $generated = Get-ChildItem "Migrations" -Filter "*_M2_2_11.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }

          if ($generated.Count -ne 1) {
            throw "La reconstrucción no produjo una única M2_2_11."
          }

          $migrationText = Get-Content $generated[0].FullName -Raw

          foreach ($table in @("OrdenesFabricacion","PlanchasAcero","Aleaciones","EstadosOrden")) {
            if (-not $migrationText.Contains(('table: "' + $table + '"'))) {
              throw "M2_2_11 reconstruida no modifica la tabla esperada: $table"
            }
          }

          $deletedAtCount = ([regex]::Matches($migrationText, 'name: "DeletedAt"')).Count
          $isDeletedCount = ([regex]::Matches($migrationText, 'name: "IsDeleted"')).Count

          if ($deletedAtCount -ne 8 -or $isDeletedCount -ne 8) {
            throw "M2_2_11 debe contener cuatro AddColumn y cuatro DropColumn para DeletedAt/IsDeleted."
          }

          if (-not $migrationText.Contains("defaultValue: false")) {
            throw "M2_2_11 no conserva false como valor por defecto para IsDeleted."
          }

          $designer = [System.IO.Path]::ChangeExtension($generated[0].FullName, ".Designer.cs")
          if (-not (Test-Path $designer)) {
            throw "La migración reconstruida M2_2_11 no genera Designer.cs."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El estado reconstruido 2.11 deja cambios de modelo pendientes."
          }

      - name: Validar rollback reaplicación y runtime 2.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.11"

          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --configuration Release
          foreach ($name in @("M2_2_10","M2_2_11")) {
            if (($list | Out-String) -notmatch $name) {
              throw "El checkpoint 2.11 no reconoce la migración $name."
            }
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El checkpoint 2.11 tiene cambios de modelo pendientes."
          }

          dotnet ef database update --configuration Release

          dotnet ef database update 20260927204833_M2_2_10 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "2.11 no puede revertir exactamente hasta la migración 2.10."
          }

          dotnet ef database update --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "2.11 no puede reaplicar M2_2_11."
          }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release --no-build 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución de 2.11 falla." }

          $text = $output | Out-String
          foreach ($token in @(
            "2.11 OK",
            "Tras borrar visibles: 0",
            "Totales: 1",
            "Restaurada: True"
          )) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.11 no demuestra el resultado funcional esperado: $token"
            }
          }

      - name: Ejecutar reto de scripts SQL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.11-scripts"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item "M02/PROYECTO/2.11" $temp -Recurse
          Set-Location $temp

          dotnet ef migrations script 20260927204833_M2_2_10 20260927204841_M2_2_11 --configuration Release --output softdelete.sql
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "softdelete.sql")) {
            throw "No se pudo generar el SQL del delta 2.10 a 2.11."
          }

          $sql = Get-Content "softdelete.sql" -Raw
          foreach ($table in @("OrdenesFabricacion","PlanchasAcero","Aleaciones","EstadosOrden")) {
            if (-not $sql.Contains($table)) {
              throw "softdelete.sql no contiene la tabla $table."
            }
          }
          foreach ($column in @("DeletedAt","IsDeleted")) {
            if (-not $sql.Contains($column)) {
              throw "softdelete.sql no contiene la columna $column."
            }
          }

          dotnet ef migrations script --idempotent --configuration Release --output migraciones_idempotentes.sql
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "migraciones_idempotentes.sql")) {
            throw "No se pudo generar el script idempotente."
          }

          $idempotent = Get-Content "migraciones_idempotentes.sql" -Raw
          foreach ($token in @("__EFMigrationsHistory","20260927204841_M2_2_11")) {
            if (-not $idempotent.Contains($token)) {
              throw "El script idempotente no contiene $token."
            }
          }

      - name: Probar migrations remove solo en copia desechable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.11-remove"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item "M02/PROYECTO/2.11" $temp -Recurse

          # dotnet ef intenta ejecutar Program.Main al resolver servicios de diseño.
          # En el checkpoint real Main hace EnsureDeleted + Migrate, lo que reaplicaría
          # 2.11 justo antes de migrations remove. Solo en esta copia desechable
          # añadimos una salida temprana controlada por variable de entorno.
          $programPath = Join-Path $temp "Program.cs"
          $program = Get-Content $programPath -Raw
          $mainPattern = '(?m)^    public static void Main\(\)\r?\n    \{'
          if ($program -notmatch $mainPattern) {
            throw "No se pudo localizar Program.Main en la copia desechable."
          }
          $guard = '        if (Environment.GetEnvironmentVariable("ACERIA_EF_TOOLS_ONLY") == "1") return;'
          $program = [regex]::Replace($program, $mainPattern, { param($m) $m.Value + [Environment]::NewLine + $guard }, 1)
          Set-Content $programPath -Value $program -Encoding utf8

          Set-Location $temp
          $env:ACERIA_EF_TOOLS_ONLY = "1"

          dotnet ef database update 20260927204833_M2_2_10 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo revertir la copia desechable hasta 2.10."
          }

          dotnet ef migrations remove --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "migrations remove falló en la copia desechable de 2.11."
          }

          if (Get-ChildItem "Migrations" -Filter "*_M2_2_11.cs") {
            throw "migrations remove no retiró M2_2_11 en la copia desechable."
          }

          $snapshot = Get-Content "Migrations/AceriaDbContextModelSnapshot.cs" -Raw
          if ($snapshot.Contains('"IsDeleted"') -or $snapshot.Contains('"DeletedAt"')) {
            throw "El snapshot de la copia no volvió al modelo 2.10 tras migrations remove."
          }


  m02_2_12:
    name: M02 2.12 desde el PDF
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core y LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global dotnet-ef --version 8.0.31
          sqllocaldb start MSSQLLocalDB

      - name: Auditar arquitectura y contrato PDF de 2.12
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "M02/PROYECTO/2.12"
          $issues = [System.Collections.Generic.List[string]]::new()

          foreach ($relative in @(
            "AceriaData.sln",
            "src/AceriaData.Domain/AceriaData.Domain.csproj",
            "src/AceriaData.Application/AceriaData.Application.csproj",
            "src/AceriaData.Infrastructure/AceriaData.Infrastructure.csproj",
            "src/AceriaData.Console/AceriaData.Console.csproj",
            "src/AceriaData.Domain/Entities.cs",
            "src/AceriaData.Application/Interfaces.cs",
            "src/AceriaData.Application/CrearOrdenUseCase.cs",
            "src/AceriaData.Infrastructure/Persistence/AceriaDbContext.cs",
            "src/AceriaData.Infrastructure/Persistence/Configurations/OrdenFabricacionConfiguration.cs",
            "src/AceriaData.Infrastructure/Persistence/Configurations/PlanchaAceroConfiguration.cs",
            "src/AceriaData.Infrastructure/Persistence/Configurations/ModeloConfiguration.cs",
            "src/AceriaData.Infrastructure/Repositories/Repositories.cs",
            "src/AceriaData.Infrastructure/DependencyInjection.cs",
            "src/AceriaData.Infrastructure/Persistence/AceriaDesignTimeDbContextFactory.cs",
            "src/AceriaData.Console/Program.cs"
          )) {
            if (-not (Test-Path (Join-Path $root $relative))) {
              $issues.Add("2.12 no contiene el archivo exigido por el PDF: $relative")
            }
          }

          $domainProject = Get-Content "$root/src/AceriaData.Domain/AceriaData.Domain.csproj" -Raw
          $applicationProject = Get-Content "$root/src/AceriaData.Application/AceriaData.Application.csproj" -Raw
          $infrastructureProject = Get-Content "$root/src/AceriaData.Infrastructure/AceriaData.Infrastructure.csproj" -Raw

          if ($domainProject -match 'EntityFrameworkCore|ProjectReference|PackageReference') {
            $issues.Add("Domain no es independiente: contiene referencias de proyecto o paquetes no permitidas por el PDF.")
          }

          if ($applicationProject -match 'EntityFrameworkCore|AceriaData\.Infrastructure') {
            $issues.Add("Application depende de EF Core o Infrastructure.")
          }
          if ($applicationProject -notmatch 'AceriaData\.Domain') {
            $issues.Add("Application no referencia Domain.")
          }

          foreach ($token in @(
            "AceriaData.Domain",
            "AceriaData.Application",
            "Microsoft.EntityFrameworkCore.SqlServer",
            "Microsoft.EntityFrameworkCore.Design"
          )) {
            if (-not $infrastructureProject.Contains($token)) {
              $issues.Add("Infrastructure no contiene la referencia exigida: $token")
            }
          }

          $domainCode = Get-ChildItem "$root/src/AceriaData.Domain" -Filter *.cs -Recurse | Get-Content -Raw
          if ($domainCode -match 'Microsoft\.EntityFrameworkCore|DbContext|DbSet<|IEntityTypeConfiguration') {
            $issues.Add("Domain contiene tipos de EF Core.")
          }

          $applicationCode = Get-ChildItem "$root/src/AceriaData.Application" -Filter *.cs -Recurse | Get-Content -Raw
          if ($applicationCode -match 'Microsoft\.EntityFrameworkCore|AceriaData\.Infrastructure|DbContext|DbSet<') {
            $issues.Add("Application contiene dependencias de persistencia.")
          }

          $entities = Get-Content "$root/src/AceriaData.Domain/Entities.cs" -Raw
          foreach ($token in @(
            "class OrdenFabricacion",
            "class PlanchaAcero",
            "class Aleacion",
            "class EstadoOrden",
            "class DetalleOrden",
            "class CertificadoCalidad",
            "class OrdenAleacion",
            "public bool IsDeleted { get; set; }",
            "public DateTime? DeletedAt { get; set; }"
          )) {
            if (-not $entities.Contains($token)) {
              $issues.Add("Domain no conserva el elemento acumulado: $token")
            }
          }

          $interfaces = Get-Content "$root/src/AceriaData.Application/Interfaces.cs" -Raw
          foreach ($token in @(
            "interface IOrdenRepositorio",
            "interface IUnidadDeTrabajo",
            "IOrdenRepositorio Ordenes { get; }",
            "int Guardar()"
          )) {
            if (-not $interfaces.Contains($token)) {
              $issues.Add("Application no contiene el puerto exigido: $token")
            }
          }

          $useCase = Get-Content "$root/src/AceriaData.Application/CrearOrdenUseCase.cs" -Raw
          foreach ($token in @(
            "class CrearOrdenUseCase",
            "IUnidadDeTrabajo",
            "_unidad.Ordenes.Agregar",
            "return _unidad.Guardar()"
          )) {
            if (-not $useCase.Contains($token)) {
              $issues.Add("CrearOrdenUseCase no contiene: $token")
            }
          }

          $dbContext = Get-Content "$root/src/AceriaData.Infrastructure/Persistence/AceriaDbContext.cs" -Raw
          foreach ($token in @(
            "AceriaDbContext : DbContext",
            "DbSet<OrdenFabricacion>",
            "DbSet<PlanchaAcero>",
            "DbSet<Aleacion>",
            "DbSet<EstadoOrden>",
            "DbSet<DetalleOrden>",
            "DbSet<CertificadoCalidad>",
            "DbSet<OrdenAleacion>",
            "ApplyConfigurationsFromAssembly(typeof(AceriaDbContext).Assembly)"
          )) {
            if (-not $dbContext.Contains($token)) {
              $issues.Add("AceriaDbContext 2.12 no contiene: $token")
            }
          }

          $configs = (
            (Get-Content "$root/src/AceriaData.Infrastructure/Persistence/Configurations/OrdenFabricacionConfiguration.cs" -Raw) +
            (Get-Content "$root/src/AceriaData.Infrastructure/Persistence/Configurations/PlanchaAceroConfiguration.cs" -Raw) +
            (Get-Content "$root/src/AceriaData.Infrastructure/Persistence/Configurations/ModeloConfiguration.cs" -Raw)
          )
          foreach ($token in @(
            "AK_OrdenesFabricacion_NumeroOrden",
            "AK_Aleaciones_Codigo",
            "AK_CertificadosCalidad_NumeroCertificado",
            "IX_OrdenesFabricacion_Cliente",
            "IX_OrdenesFabricacion_Cliente_FechaCreacion",
            "IX_OrdenesFabricacion_FechaEntrega_Pendientes",
            "IX_OrdenesFabricacion_Estado_Incluye",
            "CK_PlanchasAcero_Espesor",
            "CK_PlanchasAcero_Ancho",
            "CK_PlanchasAcero_Largo",
            "CK_PlanchasAcero_Peso",
            "CK_Aleaciones_PorcentajeCarbono",
            "CK_Aleaciones_PorcentajeManganeso",
            'HasQueryFilter(x => !x.IsDeleted && x.Estado != "Cancelada")',
            "HasQueryFilter(x => !x.IsDeleted && x.Activa)",
            "HasQueryFilter(x => !x.IsDeleted)",
            "HasQueryFilter(x => !x.IsDeleted && x.Activo)",
            'x.EstadoRelacion == "Activa" && !x.Orden.IsDeleted && !x.Aleacion.IsDeleted'
          )) {
            if (-not $configs.Contains($token)) {
              $issues.Add("Infrastructure no conserva la configuración acumulada: $token")
            }
          }

          $repositories = Get-Content "$root/src/AceriaData.Infrastructure/Repositories/Repositories.cs" -Raw
          foreach ($token in @(
            "OrdenRepositorio : IOrdenRepositorio",
            "UnidadDeTrabajo : IUnidadDeTrabajo",
            "_context.SaveChanges()"
          )) {
            if (-not $repositories.Contains($token)) {
              $issues.Add("Infrastructure no implementa correctamente el adaptador: $token")
            }
          }

          $di = Get-Content "$root/src/AceriaData.Infrastructure/DependencyInjection.cs" -Raw
          foreach ($token in @(
            "AddAceriaInfrastructure",
            "AddDbContext<AceriaDbContext>",
            "AddScoped<IOrdenRepositorio, OrdenRepositorio>",
            "AddScoped<IUnidadDeTrabajo, UnidadDeTrabajo>"
          )) {
            if (-not $di.Contains($token)) {
              $issues.Add("DependencyInjection no contiene: $token")
            }
          }

          $factory = Get-Content "$root/src/AceriaData.Infrastructure/Persistence/AceriaDesignTimeDbContextFactory.cs" -Raw
          foreach ($token in @(
            "IDesignTimeDbContextFactory<AceriaDbContext>",
            "UseSqlServer",
            "return new AceriaDbContext(options)"
          )) {
            if (-not $factory.Contains($token)) {
              $issues.Add("La factory de diseño no contiene: $token")
            }
          }

          $console = Get-Content "$root/src/AceriaData.Console/Program.cs" -Raw
          foreach ($token in @(
            "services.AddAceriaInfrastructure(cs)",
            "services.AddScoped<CrearOrdenUseCase>()",
            "context.Database.EnsureDeleted()",
            "context.Database.Migrate()",
            'crear.Ejecutar("OF-M2-HEX-0001", "Cliente Arquitectura")',
            "2.12 OK"
          )) {
            if (-not $console.Contains($token)) {
              $issues.Add("Console no contiene el flujo exigido por el PDF: $token")
            }
          }

          if (-not $console.Contains("RETO 2.12 - CREAR ORDEN DESDE USE CASE")) {
            $issues.Add("2.12 no conserva como código comentado el reto de CrearOrdenUseCase.")
          }

          $architectureMigration = Get-ChildItem "$root/src/AceriaData.Infrastructure/Migrations" -Filter "*_M2_2_12_Architecture.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }

          if ($architectureMigration.Count -ne 1) {
            $issues.Add("2.12 debe contener exactamente una migración M2_2_12_Architecture.")
          }
          else {
            $migrationText = Get-Content $architectureMigration[0].FullName -Raw
            foreach ($schemaOperation in @(
              "CreateTable(",
              "DropTable(",
              "AddColumn(",
              "DropColumn(",
              "AlterColumn(",
              "CreateIndex(",
              "DropIndex(",
              "AddForeignKey(",
              "DropForeignKey(",
              "AddUniqueConstraint(",
              "AddCheckConstraint("
            )) {
              if ($migrationText.Contains($schemaOperation)) {
                $issues.Add("La migración arquitectónica 2.12 cambia el esquema: $schemaOperation")
              }
            }
          }

          if ($issues.Count -gt 0) {
            throw ("Auditoría 2.12 detectó:" + [Environment]::NewLine + " - " + ($issues -join ([Environment]::NewLine + " - ")))
          }

      - name: Compilar y validar historial trasladado a Infrastructure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.12"

          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $efArgs = @(
            "--project", "src/AceriaData.Infrastructure",
            "--startup-project", "src/AceriaData.Console",
            "--configuration", "Release"
          )

          $list = & dotnet ef migrations list @efArgs
          if ($LASTEXITCODE -ne 0) { throw "No se puede listar el historial de migraciones de 2.12." }
          $text = $list | Out-String

          foreach ($name in @(
            "InitialCreate",
            "AddAleacion",
            "AddEstadoOrden",
            "M2_2_2",
            "M2_2_3",
            "M2_2_4",
            "M2_2_5",
            "M2_2_6",
            "M2_2_7",
            "M2_2_8",
            "M2_2_9",
            "M2_2_10",
            "M2_2_11",
            "M2_2_12_Architecture"
          )) {
            if ($text -notmatch [regex]::Escape($name)) {
              throw "2.12 no conserva en Infrastructure la migración $name."
            }
          }

          & dotnet ef migrations has-pending-model-changes @efArgs
          if ($LASTEXITCODE -ne 0) {
            throw "2.12 deja cambios de modelo pendientes."
          }

      - name: Verificar que el refactor no cambia el esquema 2.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.12"

          $scriptArgs = @(
            "migrations", "script",
            "20260927204841_M2_2_11",
            "20260927204851_M2_2_12_Architecture",
            "--project", "src/AceriaData.Infrastructure",
            "--startup-project", "src/AceriaData.Console",
            "--configuration", "Release",
            "--output", "architecture.sql"
          )
          & dotnet ef @scriptArgs

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "architecture.sql")) {
            throw "No se pudo generar el SQL del tramo 2.11 a 2.12."
          }

          $sql = Get-Content "architecture.sql" -Raw
          foreach ($forbidden in @(
            "CREATE TABLE",
            "DROP TABLE",
            "ALTER TABLE",
            "CREATE INDEX",
            "DROP INDEX"
          )) {
            if ($sql -match [regex]::Escape($forbidden)) {
              throw "2.12 cambia el esquema durante un refactor arquitectónico: $forbidden"
            }
          }

          if ($sql -notmatch "__EFMigrationsHistory") {
            throw "El script 2.11 a 2.12 no conserva el historial de migraciones."
          }

      - name: Ejecutar estado final 2.12
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.12"

          $output = & dotnet run --project src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución de 2.12 falla." }

          $text = $output | Out-String
          foreach ($token in @(
            "2.12 OK",
            "OF-M2-HEX-0001",
            "Cliente Arquitectura"
          )) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.12 no demuestra el resultado esperado: $token"
            }
          }

      - name: Ejecutar reto CrearOrdenUseCase comentado
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "M02/PROYECTO/2.12"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.12-reto"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item $source $temp -Recurse

          $programPath = Join-Path $temp "src/AceriaData.Console/Program.cs"
          $program = Get-Content $programPath -Raw
          $pattern = '(?ms)/\*\s*// RETO 2\.12 - CREAR ORDEN DESDE USE CASE\s*(.*?)\s*\*/'

          if ($program -notmatch $pattern) {
            throw "No existe el bloque comentado del reto 2.12."
          }

          $variant = [regex]::Replace($program, $pattern, '$1', 1)
          Set-Content $programPath -Value $variant -Encoding utf8

          $domainProject = Get-Content (Join-Path $temp "src/AceriaData.Domain/AceriaData.Domain.csproj") -Raw
          $applicationProject = Get-Content (Join-Path $temp "src/AceriaData.Application/AceriaData.Application.csproj") -Raw
          $applicationCode = Get-ChildItem (Join-Path $temp "src/AceriaData.Application") -Filter *.cs -Recurse | Get-Content -Raw

          if ($domainProject -match "EntityFrameworkCore") {
            throw "El reto 2.12 introduce EF Core en Domain."
          }
          if ($applicationProject -match "EntityFrameworkCore" -or $applicationCode -match "Microsoft\.EntityFrameworkCore") {
            throw "El reto 2.12 introduce EF Core en Application."
          }

          Set-Location $temp
          dotnet build AceriaData.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.12 no compila." }

          $output = & dotnet run --project src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.12 no se ejecuta." }

          $text = $output | Out-String
          foreach ($token in @(
            "Reto 2.12",
            "OF-M2-HEX-RETO",
            "Cliente Reto Arquitectura",
            "Total: 2"
          )) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "El reto 2.12 no demuestra el resultado esperado: $token"
            }
          }
