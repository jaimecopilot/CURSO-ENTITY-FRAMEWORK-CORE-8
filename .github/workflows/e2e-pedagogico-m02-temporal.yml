            "HasForeignKey(x => x.OrdenId)",
            "OnDelete(DeleteBehavior.Cascade)",
            "OnDelete(DeleteBehavior.Restrict)",
            "2.7 OK"
          )

          foreach ($token in $tokens) {
            if (-not $program.Contains($token)) {
              throw "2.7 no contiene el elemento exigido por el PDF: $token"
            }
          }

          if ($program.Contains("HasQueryFilter")) {
            throw "2.7 adelanta HasQueryFilter reservado a 2.10."
          }

          if (-not $program.Contains("RETO 2.7 - MAXLENGTH DE ANNOTATION A FLUENT")) {
            throw "2.7 no conserva como código comentado el reto MaxLength."
          }

      - name: Reconstruir M2_2_7 desde 2.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.7-rebuild"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }

          Copy-Item "M02/PROYECTO/2.6" $temp -Recurse
          Copy-Item "M02/PROYECTO/2.7/Program.cs" (Join-Path $temp "Program.cs") -Force

          Set-Location $temp
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          dotnet ef migrations add M2_2_7 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "No se puede generar M2_2_7 partiendo de 2.6."
          }

          $generated = Get-ChildItem "Migrations" -Filter "*_M2_2_7.cs" |
