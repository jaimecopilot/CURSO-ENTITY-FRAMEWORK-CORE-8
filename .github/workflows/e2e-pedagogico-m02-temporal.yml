name: E2E pedagógico definitivo M02

on:
  workflow_dispatch:
  push:
    branches:
      - fix/e2e-pedagogico-m1-m5
    paths:
      - .github/workflows/e2e-pedagogico-m02-temporal.yml
      - .github/scripts/PedagogicalHarness.psm1
      - .github/scripts/Test-M02.ps1
      - M02/PRACTICA/M02_PRACTICA.md
      - M02/PROYECTO/**

permissions:
  contents: read

concurrency:
  group: m02-definitivo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m02_definitivo:
    name: M02 definitivo · PDF → variante → build → run → PASS
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core 8 y SQL Server LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet tool update --global dotnet-ef --version 8.0.31
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global dotnet-ef --version 8.0.31
          }
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo instalar dotnet-ef 8.0.31."
          }

          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo iniciar SQL Server LocalDB."
          }

      - name: Ejecutar certificación pedagógica completa M02
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./.github/scripts/Test-M02.ps1 -Suite all
