          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --configuration Release
          if (($list | Out-String) -notmatch "M2_2_7") {
            throw "El checkpoint 2.7 no reconoce M2_2_7."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El checkpoint 2.7 tiene cambios de modelo pendientes."
          }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución de 2.7 falla." }
          $text = $output | Out-String

          foreach ($token in @("2.7 OK","Fluent API","Estado default: Pendiente")) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.7 no demuestra el resultado esperado: $token"
            }
          }

      - name: Ejecutar reto MaxLength de annotation a Fluent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "M02/PROYECTO/2.7"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.7-reto"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item $source $temp -Recurse

          $programPath = Join-Path $temp "Program.cs"
          $program = Get-Content $programPath -Raw
          $pattern = '(?ms)/\*\s*// RETO 2\.7 - MAXLENGTH DE ANNOTATION A FLUENT\s*(.*?)\s*\*/'

          if ($program -notmatch $pattern) {
            throw "No existe el bloque comentado del reto 2.7."
          }

          $variant = [regex]::Replace($program, $pattern, '$1', 1)

          # El reto pide mover MaxLength de la annotation a Fluent API.
          # Eliminamos únicamente [MaxLength(200)] de Cliente en la copia temporal.
          $clientePattern = '(?ms)(\[Required\]\s*)\[MaxLength\(200\)\](\s*public string Cliente)'
          if ($variant -notmatch $clientePattern) {
            throw "No se encontró [MaxLength(200)] sobre Cliente para ejecutar el reto 2.7."
          }
          $variant = [regex]::Replace($variant, $clientePattern, '$1$2', 1)

          Set-Content $programPath -Value $variant -Encoding utf8

          Set-Location $temp
          dotnet build AceriaData.Console.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.7 no compila." }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.7 no se ejecuta." }

          $text = $output | Out-String
          if ($text -notmatch "Reto 2.7 MaxLength Cliente: 200") {
            throw "El reto 2.7 no demuestra que Fluent conserva MaxLength 200."
          }


