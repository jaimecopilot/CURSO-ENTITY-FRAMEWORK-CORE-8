            $current = Join-Path "M02/PROYECTO/2.3" $relative
            if (-not (Test-Path $current)) {
              throw "2.3 no conserva el archivo heredado de 2.2: $relative"
            }
            if ((Get-FileHash $previous).Hash -ne (Get-FileHash $current).Hash) {
              throw "2.3 modifica sin documentarlo un archivo heredado de 2.2: $relative"
            }
          }

          $migration = Get-ChildItem "M02/PROYECTO/2.3/Migrations" -Filter "*_M2_2_3.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }
          if ($migration.Count -ne 1) {
            throw "2.3 debe contener exactamente una migración M2_2_3."
          }

          $designer = [System.IO.Path]::ChangeExtension($migration[0].FullName, ".Designer.cs")
          if (-not (Test-Path $designer)) {
            throw "La migración M2_2_3 no tiene Designer.cs."
          }

      - name: Validar contrato de código de 2.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $program = Get-Content "M02/PROYECTO/2.3/Program.cs" -Raw

          $tokens = @(
            "HasOne(x => x.Orden)",
            "WithMany(o => o.Planchas)",
            "HasForeignKey(x => x.OrdenId)",
            "OnDelete(DeleteBehavior.Cascade)",
            "IsRequired()",
            "Include(o => o.Planchas)",
            "2.3 OK"
          )

          foreach ($token in $tokens) {
            if (-not $program.Contains($token)) {
              throw "2.3 no contiene el elemento exigido por el PDF: $token"
            }
          }

          if ($program.Contains("OrdenAleacion")) {
            throw "2.3 adelanta la relación muchos-a-muchos reservada a 2.5."
          }

          if (-not $program.Contains("RETO 2.3 - DOS PLANCHAS CON INCLUDE")) {
            throw "2.3 no conserva como código comentado el reto de dos planchas."
          }

      - name: Reconstruir M2_2_3 desde 2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.3-rebuild"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item "M02/PROYECTO/2.2" $temp -Recurse
          Copy-Item "M02/PROYECTO/2.3/Program.cs" (Join-Path $temp "Program.cs") -Force

          Set-Location $temp
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release
          dotnet ef migrations add M2_2_3 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "No se puede generar M2_2_3 partiendo de 2.2."
          }

          $generated = Get-ChildItem "Migrations" -Filter "*_M2_2_3.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }
          if ($generated.Count -ne 1) {
            throw "La reconstrucción no produjo una única M2_2_3."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El estado reconstruido 2.3 deja cambios de modelo pendientes."
          }

      - name: Validar y ejecutar checkpoint 2.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.3"

          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --configuration Release
          if (($list | Out-String) -notmatch "M2_2_3") {
            throw "El checkpoint 2.3 no reconoce M2_2_3."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El checkpoint 2.3 tiene cambios de modelo pendientes."
          }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución de 2.3 falla." }
          $text = $output | Out-String

          foreach ($token in @("2.3 OK","OF-M2-0001","Planchas: 1")) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.3 no demuestra el resultado esperado: $token"
            }
          }

      - name: Ejecutar reto de dos planchas con Include
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "M02/PROYECTO/2.3"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.3-reto"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item $source $temp -Recurse

          $programPath = Join-Path $temp "Program.cs"
          $program = Get-Content $programPath -Raw
          $pattern = '(?ms)/\*\s*// RETO 2\.3 - DOS PLANCHAS CON INCLUDE\s*(.*?)\s*\*/'
          if ($program -notmatch $pattern) {
            throw "No existe el bloque comentado del reto 2.3."
          }

          $variant = [regex]::Replace($program, $pattern, '$1', 1)
          Set-Content $programPath -Value $variant -Encoding utf8

          Set-Location $temp
          dotnet build AceriaData.Console.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.3 no compila." }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.3 no se ejecuta." }
          $text = $output | Out-String

          if ($text -notmatch "Reto 2.3 planchas: 2") {
            throw "El reto 2.3 no recupera exactamente dos planchas con Include."
          }


