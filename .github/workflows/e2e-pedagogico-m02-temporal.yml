# revalidación M02 2.8 tras continuidad y reto alternate key
# revalidación M02 2.7 tras continuidad y reto Fluent real
# revalidación M02 2.6 tras continuidad y reto annotations
# revalidación M02 2.5 tras continuidad y reto ThenInclude
# revalidación M02 2.4 tras continuidad y reto de unicidad
# revalidación M02 2.3 tras continuidad y reto Include
# revalidación M02 2.2 tras continuidad y reto comentado
# revalidación M02 2.1 tras heredar M1.12 y añadir reto DeleteBehavior
name: E2E pedagógico temporal M02

on:
  push:
    branches:
      - fix/e2e-pedagogico-m1-m5
    paths:
      - .github/workflows/e2e-pedagogico-m02-temporal.yml

permissions:
  contents: read

jobs:
  m02_2_1:
    name: M02 2.1 desde el PDF
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core y LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global dotnet-ef --version 8.0.31
          sqllocaldb start MSSQLLocalDB

      - name: Validar herencia exacta de M1.12
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $same = @(
            "AceriaData.sln",
            "AceriaData.Console.csproj",
            "AceriaDesignTimeDbContextFactory.cs",
            "appsettings.json",
            "Migrations/20260927000100_InitialCreate.cs",
            "Migrations/20260927000100_InitialCreate.Designer.cs",
            "Migrations/20260927000200_AddAleacion.cs",
            "Migrations/20260927000200_AddAleacion.Designer.cs",
            "Migrations/20260927000300_AddEstadoOrden.cs",
            "Migrations/20260927000300_AddEstadoOrden.Designer.cs",
            "Migrations/AceriaDbContextModelSnapshot.cs"
          )

          foreach ($relative in $same) {
            $m1 = Join-Path "M01/PROYECTO/1.12" $relative
            $m2 = Join-Path "M02/PROYECTO/2.1" $relative

            if (-not (Test-Path $m1)) { throw "Falta en M1.12: $relative" }
            if (-not (Test-Path $m2)) { throw "2.1 no hereda el archivo de M1.12: $relative" }

            $h1 = (Get-FileHash $m1 -Algorithm SHA256).Hash
            $h2 = (Get-FileHash $m2 -Algorithm SHA256).Hash
            if ($h1 -ne $h2) {
              throw "2.1 modifica un archivo que el PDF declara heredado sin cambio: $relative"
            }
          }

          $newMigration = Get-ChildItem "M02/PROYECTO/2.1/Migrations" -File |
            Where-Object { $_.Name -match "M2_2_1|2_1" }
          if ($newMigration) {
            throw "2.1 contiene una migración nueva aunque el PDF indica que no cambia el modelo."
          }

      - name: Validar contrato de código de 2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $program = Get-Content "M02/PROYECTO/2.1/Program.cs" -Raw

          $tokens = @(
            '--- MODELO EF CORE 2.1 ---',
            'services.BuildServiceProvider(new ServiceProviderOptions',
            'ValidateScopes = true',
            'ValidateOnBuild = true',
            'provider.CreateScope()',
            'GetRequiredService<AceriaDbContext>()',
            'context.Model.GetEntityTypes()',
            'entity.FindPrimaryKey()',
            'entity.GetForeignKeys()',
            'fk.PrincipalEntityType.ClrType.Name'
          )

          foreach ($token in $tokens) {
            if (-not $program.Contains($token)) {
              throw "2.1 no contiene el elemento exigido por el PDF: $token"
            }
          }

          if ($program -match 'EnsureCreated\s*\(') {
            throw "2.1 usa EnsureCreated aunque el PDF lo prohíbe."
          }

          if (-not $program.Contains("DeleteBehavior")) {
            throw "2.1 no conserva como código activable el reto del PDF sobre DeleteBehavior."
          }

      - name: Restaurar compilar y validar migraciones heredadas
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.1"

          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --configuration Release
          $text = $list | Out-String

          foreach ($name in @("InitialCreate","AddAleacion","AddEstadoOrden")) {
            if ($text -notmatch $name) {
              throw "2.1 no reconoce la migración heredada $name."
            }
          }

          if ($text -match "M2_2_1") {
            throw "2.1 ha creado una migración propia y no debería."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "2.1 cambia el modelo respecto al snapshot heredado de M1.12."
          }

      - name: Ejecutar inspección de modelo 2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.1"

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución normal de 2.1 falla." }
          $text = $output | Out-String

          foreach ($token in @(
            "--- MODELO EF CORE 2.1 ---",
            "Entidad: Aleacion",
            "Entidad: EstadoOrden",
            "Entidad: OrdenFabricacion",
            "Entidad: PlanchaAcero",
            "FK: OrdenId -> OrdenFabricacion"
          )) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.1 no demuestra el resultado esperado: $token"
            }
          }

      - name: Ejecutar reto DeleteBehavior
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "M02/PROYECTO/2.1"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.1-reto"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item $source $temp -Recurse

          $programPath = Join-Path $temp "Program.cs"
          $program = Get-Content $programPath -Raw
          $pattern = '(?ms)/\*\s*// RETO 2\.1 - DELETEBEHAVIOR\s*(.*?)\s*\*/'

          if ($program -notmatch $pattern) {
            throw "No existe el bloque comentado activable del reto DeleteBehavior."
          }

          $variant = [regex]::Replace($program, $pattern, '$1', 1)
          Set-Content $programPath -Value $variant -Encoding utf8

          Set-Location $temp
          dotnet build AceriaData.Console.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "La variante DeleteBehavior no compila." }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La variante DeleteBehavior no se ejecuta." }
          $text = $output | Out-String

          if ($text -notmatch "DeleteBehavior:") {
            throw "El reto no muestra DeleteBehavior."
          }


  m02_2_2:
    name: M02 2.2 desde el PDF
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core y LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global dotnet-ef --version 8.0.31
          sqllocaldb start MSSQLLocalDB

      - name: Validar continuidad 2.1 a 2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $inherited = @(
            "AceriaData.sln",
            "AceriaData.Console.csproj",
            "AceriaDesignTimeDbContextFactory.cs",
            "appsettings.json",
            "Migrations/20260927000100_InitialCreate.cs",
            "Migrations/20260927000100_InitialCreate.Designer.cs",
            "Migrations/20260927000200_AddAleacion.cs",
            "Migrations/20260927000200_AddAleacion.Designer.cs",
            "Migrations/20260927000300_AddEstadoOrden.cs",
            "Migrations/20260927000300_AddEstadoOrden.Designer.cs"
          )

          foreach ($relative in $inherited) {
            $previous = Join-Path "M02/PROYECTO/2.1" $relative
            $current = Join-Path "M02/PROYECTO/2.2" $relative

            if (-not (Test-Path $current)) {
              throw "2.2 no conserva el archivo heredado de 2.1: $relative"
            }

            if ((Get-FileHash $previous).Hash -ne (Get-FileHash $current).Hash) {
              throw "2.2 modifica sin documentarlo un archivo heredado de 2.1: $relative"
            }
          }

          $migration = Get-ChildItem "M02/PROYECTO/2.2/Migrations" -Filter "*_M2_2_2.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }

          if ($migration.Count -ne 1) {
            throw "2.2 debe contener exactamente una migración M2_2_2."
          }

          $designer = [System.IO.Path]::ChangeExtension($migration[0].FullName, ".Designer.cs")
          if (-not (Test-Path $designer)) {
            throw "La migración M2_2_2 no tiene Designer.cs."
          }

      - name: Validar contrato de código de 2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $program = Get-Content "M02/PROYECTO/2.2/Program.cs" -Raw

          $tokens = @(
            "DateTime? FechaEntrega",
            "string? Observaciones",
            'string Estado { get; set; } = "Pendiente"',
            "decimal Peso",
            "bool Activa",
            "string Codigo",
            "bool Activo",
            "HasPrecision(18, 3)",
            "HasDefaultValue(true)",
            "HasMaxLength(500)",
            "context.Database.Migrate()",
            "2.2 OK"
          )

          foreach ($token in $tokens) {
            if (-not $program.Contains($token)) {
              throw "2.2 no contiene el elemento exigido por el PDF: $token"
            }
          }

          if ($program -match 'EnsureCreated\s*\(') {
            throw "2.2 usa EnsureCreated aunque el PDF exige Migrations."
          }

          if (-not $program.Contains("RETO 2.2 - COMPROBAR PROPIEDADES")) {
            throw "2.2 no conserva como código comentado la comprobación del reto."
          }

      - name: Reconstruir migración 2.2 desde 2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.2-rebuild"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item "M02/PROYECTO/2.1" $temp -Recurse

          Copy-Item "M02/PROYECTO/2.2/Program.cs" (Join-Path $temp "Program.cs") -Force

          Set-Location $temp
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release
          dotnet ef migrations add M2_2_2 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "No se puede generar M2_2_2 partiendo de 2.1."
          }

          $generated = Get-ChildItem "Migrations" -Filter "*_M2_2_2.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }
          if ($generated.Count -ne 1) {
            throw "La reconstrucción no produjo una única M2_2_2."
          }

          $migrationText = Get-Content $generated[0].FullName -Raw
          foreach ($token in @("FechaEntrega","Observaciones","Peso","Activa","Codigo","Activo")) {
            if (-not $migrationText.Contains($token)) {
              throw "La migración reconstruida no contiene el cambio esperado: $token"
            }
          }

          if ($migrationText -match "CreateIndex\(") {
            throw "M2_2_2 adelanta índices de negocio reservados a 2.9."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El estado reconstruido 2.2 deja cambios de modelo pendientes."
          }

      - name: Validar y ejecutar checkpoint 2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.2"

          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --configuration Release
          if (($list | Out-String) -notmatch "M2_2_2") {
            throw "El checkpoint 2.2 no reconoce M2_2_2."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El checkpoint 2.2 tiene cambios de modelo pendientes."
          }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución de 2.2 falla." }
          $text = $output | Out-String

          foreach ($token in @("2.2 OK","Órdenes: 1","Planchas: 1")) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.2 no demuestra el resultado esperado: $token"
            }
          }

      - name: Ejecutar comprobación comentada del reto 2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "M02/PROYECTO/2.2"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.2-reto"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item $source $temp -Recurse

          $programPath = Join-Path $temp "Program.cs"
          $program = Get-Content $programPath -Raw
          $pattern = '(?ms)/\*\s*// RETO 2\.2 - COMPROBAR PROPIEDADES\s*(.*?)\s*\*/'

          if ($program -notmatch $pattern) {
            throw "No existe el bloque comentado del reto 2.2."
          }

          $variant = [regex]::Replace($program, $pattern, '$1', 1)
          Set-Content $programPath -Value $variant -Encoding utf8

          Set-Location $temp
          dotnet build AceriaData.Console.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.2 no compila." }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.2 no se ejecuta." }
          $text = $output | Out-String

          if ($text -notmatch "Observaciones nullable: True") {
            throw "El reto no confirma que Observaciones es opcional."
          }
          if ($text -notmatch "Peso precision/scale: 18/3") {
            throw "El reto no confirma la precisión 18,3 de Peso."
          }


  m02_2_3:
    name: M02 2.3 desde el PDF
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core y LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global dotnet-ef --version 8.0.31
          sqllocaldb start MSSQLLocalDB

      - name: Validar continuidad 2.2 a 2.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $inherited = @(
            "AceriaData.sln",
            "AceriaData.Console.csproj",
            "AceriaDesignTimeDbContextFactory.cs",
            "appsettings.json",
            "Migrations/20260927000100_InitialCreate.cs",
            "Migrations/20260927000100_InitialCreate.Designer.cs",
            "Migrations/20260927000200_AddAleacion.cs",
            "Migrations/20260927000200_AddAleacion.Designer.cs",
            "Migrations/20260927000300_AddEstadoOrden.cs",
            "Migrations/20260927000300_AddEstadoOrden.Designer.cs",
            "Migrations/20260927204717_M2_2_2.cs",
            "Migrations/20260927204717_M2_2_2.Designer.cs",
            "Migrations/AceriaDbContextModelSnapshot.cs"
          )

          foreach ($relative in $inherited) {
            $previous = Join-Path "M02/PROYECTO/2.2" $relative
            $current = Join-Path "M02/PROYECTO/2.3" $relative
            if (-not (Test-Path $current)) {
              throw "2.3 no conserva el archivo heredado de 2.2: $relative"
            }
            if ((Get-FileHash $previous).Hash -ne (Get-FileHash $current).Hash) {
              throw "2.3 modifica sin documentarlo un archivo heredado de 2.2: $relative"
            }
          }

          $migration = Get-ChildItem "M02/PROYECTO/2.3/Migrations" -Filter "*_M2_2_3.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }
          if ($migration.Count -ne 1) {
            throw "2.3 debe contener exactamente una migración M2_2_3."
          }

          $designer = [System.IO.Path]::ChangeExtension($migration[0].FullName, ".Designer.cs")
          if (-not (Test-Path $designer)) {
            throw "La migración M2_2_3 no tiene Designer.cs."
          }

      - name: Validar contrato de código de 2.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $program = Get-Content "M02/PROYECTO/2.3/Program.cs" -Raw

          $tokens = @(
            "HasOne(x => x.Orden)",
            "WithMany(o => o.Planchas)",
            "HasForeignKey(x => x.OrdenId)",
            "OnDelete(DeleteBehavior.Cascade)",
            "IsRequired()",
            "Include(o => o.Planchas)",
            "2.3 OK"
          )

          foreach ($token in $tokens) {
            if (-not $program.Contains($token)) {
              throw "2.3 no contiene el elemento exigido por el PDF: $token"
            }
          }

          if ($program.Contains("OrdenAleacion")) {
            throw "2.3 adelanta la relación muchos-a-muchos reservada a 2.5."
          }

          if (-not $program.Contains("RETO 2.3 - DOS PLANCHAS CON INCLUDE")) {
            throw "2.3 no conserva como código comentado el reto de dos planchas."
          }

      - name: Reconstruir M2_2_3 desde 2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.3-rebuild"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item "M02/PROYECTO/2.2" $temp -Recurse
          Copy-Item "M02/PROYECTO/2.3/Program.cs" (Join-Path $temp "Program.cs") -Force

          Set-Location $temp
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release
          dotnet ef migrations add M2_2_3 --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "No se puede generar M2_2_3 partiendo de 2.2."
          }

          $generated = Get-ChildItem "Migrations" -Filter "*_M2_2_3.cs" |
            Where-Object { $_.Name -notmatch "\.Designer\.cs$" }
          if ($generated.Count -ne 1) {
            throw "La reconstrucción no produjo una única M2_2_3."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El estado reconstruido 2.3 deja cambios de modelo pendientes."
          }

      - name: Validar y ejecutar checkpoint 2.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M02/PROYECTO/2.3"

          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --configuration Release
          if (($list | Out-String) -notmatch "M2_2_3") {
            throw "El checkpoint 2.3 no reconoce M2_2_3."
          }

          dotnet ef migrations has-pending-model-changes --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "El checkpoint 2.3 tiene cambios de modelo pendientes."
          }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La ejecución de 2.3 falla." }
          $text = $output | Out-String

          foreach ($token in @("2.3 OK","OF-M2-0001","Planchas: 1")) {
            if ($text -notmatch [regex]::Escape($token)) {
              throw "2.3 no demuestra el resultado esperado: $token"
            }
          }

      - name: Ejecutar reto de dos planchas con Include
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "M02/PROYECTO/2.3"
          $temp = Join-Path $env:RUNNER_TEMP "e2e-m02-2.3-reto"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Copy-Item $source $temp -Recurse

          $programPath = Join-Path $temp "Program.cs"
          $program = Get-Content $programPath -Raw
          $pattern = '(?ms)/\*\s*// RETO 2\.3 - DOS PLANCHAS CON INCLUDE\s*(.*?)\s*\*/'
          if ($program -notmatch $pattern) {
            throw "No existe el bloque comentado del reto 2.3."
          }

          $variant = [regex]::Replace($program, $pattern, '$1', 1)
          Set-Content $programPath -Value $variant -Encoding utf8

          Set-Location $temp
          dotnet build AceriaData.Console.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.3 no compila." }

          $output = & dotnet run --project AceriaData.Console.csproj --configuration Release 2>&1
          if ($LASTEXITCODE -ne 0) { throw "La variante del reto 2.3 no se ejecuta." }
          $text = $output | Out-String

          if ($text -notmatch "Reto 2.3 planchas: 2") {
            throw "El reto 2.3 no recupera exactamente dos planchas con Include."
          }


