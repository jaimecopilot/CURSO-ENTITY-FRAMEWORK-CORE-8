          if ($generated.Count -ne 1) {
            throw "La reconstrucción no produjo una única M2_2_7."
          }

          $migrationText = Get-Content $generated[0].FullName -Raw
          foreach ($token in @(
            "AlterColumn",
            '"Activa"',
