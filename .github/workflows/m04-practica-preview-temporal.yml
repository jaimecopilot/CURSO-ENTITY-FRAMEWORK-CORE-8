name: Preview PDF práctica M04

on:
  workflow_dispatch:
  push:
    branches:
      - fix/revision-editorial-pdfs-m02-m05
    paths:
      - M04/PRACTICA/M04_PRACTICA.md
      - .github/scripts/build_m04_practica_preview.py
      - .github/workflows/m04-practica-preview-temporal.yml

permissions:
  contents: write

concurrency:
  group: revision-editorial-pdfs-m04
  cancel-in-progress: true

# Regeneración tras ajuste de explicaciones línea a línea.
jobs:
  preview:
    name: M04 · PDF canónico + previews 4.1–4.12
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '4.12'

      - name: Instalar motor PDF y renderizador
        run: |
          python -m pip install --upgrade pip
          pip install mistune pygments weasyprint
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generar PDF oficial y previews desde la práctica canónica
        run: |
          python .github/scripts/build_m04_practica_preview.py
          pdfinfo M04/PRACTICA/M04_PRACTICA.pdf
          for point in 4.1 4.2 4.3 4.4 4.5 4.6 4.7 4.8 4.9 4.10 4.11 4.12; do
            pdfinfo "M04/PRACTICA/_preview/M04_PRACTICA_${point}_PREVIEW.pdf"
          done

      - name: Validar cobertura textual canónica
        shell: bash
        run: |
          pdftotext M04/PRACTICA/M04_PRACTICA.pdf /tmp/m04-practica.txt
          for point in 4.1 4.2 4.3 4.4 4.5 4.6 4.7 4.8 4.9 4.10 4.11 4.12; do
            grep -Fq "Punto ${point}" /tmp/m04-practica.txt || exit 1
          done
          test "$(grep -c 'Reto resuelto:' /tmp/m04-practica.txt)" -ge 12
          test "$(grep -c 'Resultado esperado' /tmp/m04-practica.txt)" -ge 12
          echo "M04 PDF: 4.1-4.12 + 12 RETOS + RESULTADOS PRESENTES"

      - name: Renderizar previews para revisión visual
        shell: bash
        run: |
          mkdir -p M04/PRACTICA/_preview
          rm -f M04/PRACTICA/_preview/p3*.png
          for point in 4.1 4.2 4.3 4.4 4.5 4.6 4.7 4.8 4.9 4.10 4.11 4.12; do
            suffix="${point//./}"
            pdftoppm -png -r 110               "M04/PRACTICA/_preview/M04_PRACTICA_${point}_PREVIEW.pdf"               "M04/PRACTICA/_preview/p${suffix}"
          done

      - name: Publicar PDF oficial y previews en la rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A M04/PRACTICA/_preview/ M04/PRACTICA/M04_PRACTICA.pdf
          if git diff --cached --quiet; then
            echo "PDF y previews sin cambios."
          else
            git commit -m "docs(m3): actualizar PDF canónico y previews"
            git push
          fi