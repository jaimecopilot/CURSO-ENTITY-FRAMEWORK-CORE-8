name: E2E pedagógico temporal
# v2: checkpoints con RootNamespace AceriaData.ConsoleApp

on:
  push:
    branches:
      - fix/e2e-pedagogico-m1-m5
    paths:
      - .github/workflows/e2e-pedagogico-temporal.yml

permissions:
  contents: read

jobs:
  m01_1_1_1_2:
    name: M01 1.1-1.2 desde el PDF
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar dotnet-ef 8.0.31
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.31
          dotnet ef --version

      - name: E2E 1.1 - reconstruir desde carpeta vacía
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.1"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null
          Set-Location $root

          mkdir AceriaData | Out-Null
          Set-Location AceriaData
          dotnet new sln -n AceriaData
          dotnet new console -n AceriaData.Console --framework net8.0
          dotnet sln add AceriaData.Console/AceriaData.Console.csproj
          Set-Location AceriaData.Console
          dotnet add package Microsoft.EntityFrameworkCore.SqlServer --version 8.0.31
          dotnet add package Microsoft.EntityFrameworkCore.Design --version 8.0.31

          @'
          Console.WriteLine("=== ACERÍA DEL NORTE ===");
          Console.WriteLine("Sistema de gestión de órdenes de fabricación");
          Console.WriteLine("Proyecto AceriaData inicializado");
          '@ | Set-Content Program.cs -Encoding utf8

          dotnet build --configuration Release
          $output = dotnet run --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "1.1 no se ejecuta." }

          $required = @(
            "=== ACERÍA DEL NORTE ===",
            "Sistema de gestión de órdenes de fabricación",
            "Proyecto AceriaData inicializado"
          )
          foreach ($line in $required) {
            if ($output -notcontains $line) { throw "1.1 no contiene la salida esperada: $line" }
          }

      - name: Checkpoint 1.1 - compilar la solución publicada
        shell: pwsh
        run: |
          Set-Location "M01/PROYECTO/1.1"
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release
          $output = dotnet run --project AceriaData.Console/AceriaData.Console.csproj --configuration Release
          $required = @(
            "=== ACERÍA DEL NORTE ===",
            "Sistema de gestión de órdenes de fabricación",
            "Proyecto AceriaData inicializado"
          )
          foreach ($line in $required) {
            if ($output -notcontains $line) { throw "Checkpoint 1.1 no contiene: $line" }
          }

      - name: Verificar LocalDB para 1.2
        shell: pwsh
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB

      - name: E2E 1.2 - crear, insertar, consultar y limpiar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.2"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Copy-Item "M01/PROYECTO/1.1" $root -Recurse
          Set-Location (Join-Path $root "AceriaData.Console")

          @'
          using Microsoft.EntityFrameworkCore;

          namespace AceriaData.ConsoleApp;

          public class OrdenFabricacion
          {
              public int Id { get; set; }
              public string NumeroOrden { get; set; } = string.Empty;
              public string Cliente { get; set; } = string.Empty;
              public DateTime FechaCreacion { get; set; }
          }

          public class AceriaDbContext : DbContext
          {
              public DbSet<OrdenFabricacion> OrdenesFabricacion { get; set; } = null!;

              protected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)
              {
                  optionsBuilder.UseSqlServer(
                      @"Server=(localdb)\mssqllocaldb;Database=AceriaDB;Trusted_Connection=True;");
              }
          }

          public class Program
          {
              public static void Main()
              {
                  using var context = new AceriaDbContext();
                  context.Database.EnsureDeleted();
                  context.Database.EnsureCreated();

                  var orden = new OrdenFabricacion
                  {
                      NumeroOrden = "OF-001",
                      Cliente = "Constructora del Norte",
                      FechaCreacion = DateTime.Now
                  };

                  context.OrdenesFabricacion.Add(orden);
                  context.SaveChanges();

                  var ordenes = context.OrdenesFabricacion.ToList();
                  if (ordenes.Count != 1) throw new Exception("1.2 no recupera la orden insertada.");

                  Console.WriteLine($"Orden {orden.NumeroOrden} insertada con Id {orden.Id}.");
                  foreach (var item in ordenes)
                  {
                      Console.WriteLine($"Id: {item.Id} | Número: {item.NumeroOrden} | Cliente: {item.Cliente} | Fecha: {item.FechaCreacion:dd/MM/yyyy}");
                  }

                  context.Database.EnsureDeleted();
              }
          }
          '@ | Set-Content Program.cs -Encoding utf8

          dotnet build --configuration Release
          $output = dotnet run --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "1.2 no se ejecuta." }
          if (($output -join "`n") -notmatch "OF-001") { throw "1.2 no muestra la orden esperada." }

      - name: Checkpoint 1.2 - compilar estado final
        shell: pwsh
        run: |
          Set-Location "M01/PROYECTO/1.2"
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release
          dotnet run --project AceriaData.Console/AceriaData.Console.csproj --configuration Release


  m01_1_3:
    name: M01 1.3 desde el PDF y migraciones reales
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar dotnet-ef 8.0.31
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.31
          dotnet ef --version

      - name: Iniciar LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB

      - name: Construir 1.3 desde 1.2 y generar InitialCreate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.3"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Copy-Item "M01/PROYECTO/1.2" $root -Recurse
          Set-Location (Join-Path $root "AceriaData.Console")

          @'
          using Microsoft.EntityFrameworkCore;

          namespace AceriaData.ConsoleApp;

          public class OrdenFabricacion
          {
              public int Id { get; set; }
              public string NumeroOrden { get; set; } = string.Empty;
              public string Cliente { get; set; } = string.Empty;
              public DateTime FechaCreacion { get; set; }

              // El reto final del PDF usa Include(o => o.Planchas).
              // Esta navegación es necesaria para ejecutar literalmente ese reto.
              public List<PlanchaAcero> Planchas { get; set; } = new();
          }

          public class PlanchaAcero
          {
              public int Id { get; set; }
              public int OrdenId { get; set; }
              public double Espesor { get; set; }
              public double Ancho { get; set; }
              public double Largo { get; set; }
              public OrdenFabricacion Orden { get; set; } = null!;
          }

          public class AceriaDbContext : DbContext
          {
              public DbSet<OrdenFabricacion> OrdenesFabricacion { get; set; } = null!;
              public DbSet<PlanchaAcero> PlanchasAcero { get; set; } = null!;

              protected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)
              {
                  optionsBuilder.UseSqlServer(
                      @"Server=(localdb)\mssqllocaldb;Database=AceriaDB;Trusted_Connection=True;");
              }
          }

          public class Program
          {
              public static void Main()
              {
                  using var context = new AceriaDbContext();
                  Console.WriteLine($"Proveedor: {context.Database.ProviderName}");
                  Console.WriteLine($"Entidades en el modelo: {context.Model.GetEntityTypes().Count()}");

                  foreach (var entidad in context.Model.GetEntityTypes())
                  {
                      Console.WriteLine($"Entidad: {entidad.ClrType.Name} -> Tabla: {entidad.GetTableName()}");

                      foreach (var propiedad in entidad.GetProperties())
                      {
                          Console.WriteLine(
                              $" Propiedad: {propiedad.Name} | Columna: {propiedad.GetColumnName()} | Tipo: {propiedad.ClrType.Name}");
                      }
                  }
              }
          }
          '@ | Set-Content Program.cs -Encoding utf8

          if (Test-Path Migrations) { Remove-Item Migrations -Recurse -Force }

          dotnet build --configuration Release
          dotnet ef migrations add InitialCreate
          if ($LASTEXITCODE -ne 0) { throw "No se pudo generar InitialCreate." }

          $files = Get-ChildItem Migrations -File
          if (($files | Where-Object Name -like "*_InitialCreate.cs").Count -ne 1) {
              throw "El PDF exige InitialCreate.cs."
          }
          if (($files | Where-Object Name -like "*_InitialCreate.Designer.cs").Count -ne 1) {
              throw "El PDF exige InitialCreate.Designer.cs."
          }
          if (($files | Where-Object Name -eq "AceriaDbContextModelSnapshot.cs").Count -ne 1) {
              throw "El PDF exige AceriaDbContextModelSnapshot.cs."
          }

          dotnet ef database update
          $list = dotnet ef migrations list
          if (($list -join "`n") -notmatch "InitialCreate") {
              throw "InitialCreate no aparece en migrations list."
          }

      - name: Añadir Aleacion y generar AddAleacion
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.3"
          Set-Location (Join-Path $root "AceriaData.Console")

          $program = Get-Content Program.cs -Raw
          $aleacion = @'

          public class Aleacion
          {
              public int Id { get; set; }
              public string Nombre { get; set; } = string.Empty;
              public double PorcentajeCarbono { get; set; }
              public double PorcentajeManganeso { get; set; }
          }
          '@

          $program = $program.Replace(
              "public class AceriaDbContext : DbContext",
              $aleacion + [Environment]::NewLine + "public class AceriaDbContext : DbContext"
          )
          $program = $program.Replace(
              "public DbSet<PlanchaAcero> PlanchasAcero { get; set; } = null!;",
              "public DbSet<PlanchaAcero> PlanchasAcero { get; set; } = null!;" + [Environment]::NewLine +
              "    public DbSet<Aleacion> Aleaciones { get; set; } = null!;"
          )
          Set-Content Program.cs -Value $program -Encoding utf8

          dotnet build --configuration Release
          dotnet ef migrations add AddAleacion
          if ($LASTEXITCODE -ne 0) { throw "No se pudo generar AddAleacion." }

          $files = Get-ChildItem Migrations -File
          if (($files | Where-Object Name -like "*_AddAleacion.cs").Count -ne 1) {
              throw "Falta AddAleacion.cs."
          }
          if (($files | Where-Object Name -like "*_AddAleacion.Designer.cs").Count -ne 1) {
              throw "Falta AddAleacion.Designer.cs."
          }

          dotnet ef database update
          $list = dotnet ef migrations list
          if (($list -join "`n") -notmatch "InitialCreate") { throw "Falta InitialCreate aplicada." }
          if (($list -join "`n") -notmatch "AddAleacion") { throw "Falta AddAleacion aplicada." }

      - name: Ejecutar reto final del punto 1.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.3"
          Set-Location (Join-Path $root "AceriaData.Console")

          $program = Get-Content Program.cs -Raw
          $start = $program.IndexOf("public class Program")
          if ($start -lt 0) { throw "No se encontró Program." }
          $prefix = $program.Substring(0, $start)

          $main = @'
          public class Program
          {
              public static void Main()
              {
                  using var context = new AceriaDbContext();
                  context.Database.EnsureDeleted();
                  context.Database.Migrate();

                  var orden = new OrdenFabricacion
                  {
                      NumeroOrden = "OF-001",
                      Cliente = "Constructora del Norte",
                      FechaCreacion = DateTime.Now
                  };

                  context.OrdenesFabricacion.Add(orden);
                  context.SaveChanges();

                  var plancha1 = new PlanchaAcero
                  {
                      OrdenId = orden.Id,
                      Espesor = 10.5,
                      Ancho = 1500,
                      Largo = 3000
                  };
                  var plancha2 = new PlanchaAcero
                  {
                      OrdenId = orden.Id,
                      Espesor = 12.0,
                      Ancho = 1200,
                      Largo = 2500
                  };

                  context.PlanchasAcero.AddRange(plancha1, plancha2);
                  context.SaveChanges();

                  var ordenRecuperada = context.OrdenesFabricacion
                      .Include(o => o.Planchas)
                      .FirstOrDefault(o => o.Id == orden.Id);

                  if (ordenRecuperada is null || ordenRecuperada.Planchas.Count != 2)
                  {
                      throw new Exception("El reto final de 1.3 no recupera las dos planchas.");
                  }

                  Console.WriteLine($"Orden: {ordenRecuperada.NumeroOrden}");
                  foreach (var plancha in ordenRecuperada.Planchas)
                  {
                      Console.WriteLine(
                          $" Plancha Id {plancha.Id} | Espesor: {plancha.Espesor} | Ancho: {plancha.Ancho} | Largo: {plancha.Largo}");
                  }
              }
          }
          '@

          Set-Content Program.cs -Value ($prefix + $main) -Encoding utf8
          dotnet build --configuration Release
          $output = dotnet run --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "El reto final de 1.3 no se ejecuta." }
          if (($output -join "`n") -notmatch "OF-001") { throw "No aparece la orden del reto." }

      - name: Checkpoint 1.3 - validar estado publicado
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M01/PROYECTO/1.3"
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --project AceriaData.Console/AceriaData.Console.csproj
          if (($list -join "`n") -notmatch "InitialCreate") { throw "Checkpoint 1.3 no contiene InitialCreate." }
          if (($list -join "`n") -notmatch "AddAleacion") { throw "Checkpoint 1.3 no contiene AddAleacion." }

          $output = dotnet run --project AceriaData.Console/AceriaData.Console.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Checkpoint 1.3 no se ejecuta." }
          if (($output -join "`n") -notmatch "Orden: OF-001") { throw "Checkpoint 1.3 no ejecuta el reto final." }
          $planchas = @($output | Where-Object { $_ -match "Plancha Id" })
          if ($planchas.Count -ne 2) { throw "Checkpoint 1.3 no muestra exactamente dos planchas." }

      - name: Preparar artefacto del 1.3 reconstruido
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.3"
          Get-ChildItem $root -Recurse -Directory -Filter bin | Remove-Item -Recurse -Force
          Get-ChildItem $root -Recurse -Directory -Filter obj | Remove-Item -Recurse -Force

      - name: Subir 1.3 reconstruido
        uses: actions/upload-artifact@v4
        with:
          name: m01-1.3-reconstruido
          path: ${{ runner.temp }}/e2e-m01-1.3
          if-no-files-found: error


  m01_1_4:
    name: M01 1.4 desde el PDF
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar dotnet-ef 8.0.31
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.31
          sqllocaldb start MSSQLLocalDB

      - name: Construir 1.4 desde 1.3 y generar AddEstadoOrden
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.4"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Copy-Item "M01/PROYECTO/1.3" $root -Recurse
          Set-Location (Join-Path $root "AceriaData.Console")

          @'
          using Microsoft.EntityFrameworkCore;

          namespace AceriaData.ConsoleApp;

          public class OrdenFabricacion
          {
              public int Id { get; set; }
              public string NumeroOrden { get; set; } = string.Empty;
              public string Cliente { get; set; } = string.Empty;
              public DateTime FechaCreacion { get; set; }
              public List<PlanchaAcero> Planchas { get; set; } = new();
          }

          public class PlanchaAcero
          {
              public int Id { get; set; }
              public int OrdenId { get; set; }
              public double Espesor { get; set; }
              public double Ancho { get; set; }
              public double Largo { get; set; }
              public OrdenFabricacion Orden { get; set; } = null!;
          }

          public class Aleacion
          {
              public int Id { get; set; }
              public string Nombre { get; set; } = string.Empty;
              public double PorcentajeCarbono { get; set; }
              public double PorcentajeManganeso { get; set; }
          }

          public class EstadoOrden
          {
              public int Id { get; set; }
              public string Nombre { get; set; } = string.Empty;
              public string Descripcion { get; set; } = string.Empty;
          }

          public class AceriaDbContext : DbContext
          {
              public DbSet<OrdenFabricacion> OrdenesFabricacion { get; set; } = null!;
              public DbSet<PlanchaAcero> PlanchasAcero { get; set; } = null!;
              public DbSet<Aleacion> Aleaciones { get; set; } = null!;
              public DbSet<EstadoOrden> EstadosOrden { get; set; } = null!;

              protected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)
              {
                  optionsBuilder.UseSqlServer(
                      @"Server=(localdb)\mssqllocaldb;Database=AceriaDB;Trusted_Connection=True;");
              }
          }

          public class Program
          {
              public static void Main()
              {
                  using var context = new AceriaDbContext();
                  foreach (var entidad in context.Model.GetEntityTypes())
                  {
                      Console.WriteLine($"Entidad: {entidad.ClrType.Name} -> Tabla: {entidad.GetTableName()}");
                      foreach (var propiedad in entidad.GetProperties())
                      {
                          Console.WriteLine(
                              $" Propiedad: {propiedad.Name} | Columna: {propiedad.GetColumnName()} | Tipo: {propiedad.ClrType.Name}");
                      }
                  }
              }
          }
          '@ | Set-Content Program.cs -Encoding utf8

          dotnet build --configuration Release
          dotnet ef migrations add AddEstadoOrden
          if ($LASTEXITCODE -ne 0) { throw "No se pudo generar AddEstadoOrden." }

          $files = Get-ChildItem Migrations -File
          if (($files | Where-Object Name -like "*_AddEstadoOrden.cs").Count -ne 1) { throw "Falta AddEstadoOrden.cs." }
          if (($files | Where-Object Name -like "*_AddEstadoOrden.Designer.cs").Count -ne 1) { throw "Falta AddEstadoOrden.Designer.cs." }
          if (($files | Where-Object Name -eq "AceriaDbContextModelSnapshot.cs").Count -ne 1) { throw "Falta snapshot actualizado." }

          dotnet ef database drop --force
          dotnet ef database update
          $list = dotnet ef migrations list
          foreach ($name in @("InitialCreate","AddAleacion","AddEstadoOrden")) {
              if (($list -join "`n") -notmatch $name) { throw "No aparece $name en migrations list." }
          }

      - name: Probar SaveChanges y Change Tracker de 1.4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.4"
          Set-Location (Join-Path $root "AceriaData.Console")

          $program = Get-Content Program.cs -Raw
          $start = $program.IndexOf("public class Program")
          $prefix = $program.Substring(0, $start)
          $main = @'
          public class Program
          {
              public static void Main()
              {
                  using var context = new AceriaDbContext();
                  context.Database.EnsureDeleted();
                  context.Database.Migrate();

                  var aleacion = new Aleacion
                  {
                      Nombre = "AISI 1045",
                      PorcentajeCarbono = 0.45,
                      PorcentajeManganeso = 0.75
                  };

                  context.Aleaciones.Add(aleacion);
                  var antes = context.Entry(aleacion).State;
                  var filas = context.SaveChanges();
                  var despues = context.Entry(aleacion).State;

                  if (antes != EntityState.Added) throw new Exception($"Estado previo inesperado: {antes}");
                  if (despues != EntityState.Unchanged) throw new Exception($"Estado posterior inesperado: {despues}");
                  if (filas != 1) throw new Exception($"SaveChanges devolvió {filas} filas.");

                  Console.WriteLine($"Filas afectadas: {filas}");
                  Console.WriteLine($"Aleación insertada con Id {aleacion.Id}");
                  Console.WriteLine($"Antes: {antes}; Después: {despues}");
              }
          }
          '@
          Set-Content Program.cs -Value ($prefix + $main) -Encoding utf8
          dotnet build --configuration Release
          $output = dotnet run --configuration Release
          if (($output -join "`n") -notmatch "Filas afectadas: 1") { throw "No se valida SaveChanges." }
          if (($output -join "`n") -notmatch "Added; Después: Unchanged") { throw "No se valida Change Tracker." }

      - name: Restaurar reto final y preparar artefacto
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "e2e-m01-1.4"
          Set-Location (Join-Path $root "AceriaData.Console")
          $program = Get-Content Program.cs -Raw
          $start = $program.IndexOf("public class Program")
          $prefix = $program.Substring(0, $start)
          $main = @'
          public class Program
          {
              public static void Main()
              {
                  using var context = new AceriaDbContext();
                  foreach (var entidad in context.Model.GetEntityTypes())
                  {
                      Console.WriteLine($"Entidad: {entidad.ClrType.Name} -> Tabla: {entidad.GetTableName()}");
                      foreach (var propiedad in entidad.GetProperties())
                      {
                          Console.WriteLine(
                              $" Propiedad: {propiedad.Name} | Columna: {propiedad.GetColumnName()} | Tipo: {propiedad.ClrType.Name}");
                      }
                  }
              }
          }
          '@
          Set-Content Program.cs -Value ($prefix + $main) -Encoding utf8
          dotnet build --configuration Release
          $output = dotnet run --configuration Release
          foreach ($entity in @("OrdenFabricacion","PlanchaAcero","Aleacion","EstadoOrden")) {
              if (($output -join "`n") -notmatch $entity) { throw "El reto final no muestra $entity." }
          }
          Get-ChildItem $root -Recurse -Directory -Filter bin | Remove-Item -Recurse -Force
          Get-ChildItem $root -Recurse -Directory -Filter obj | Remove-Item -Recurse -Force

      - name: Checkpoint 1.4 - validar estado publicado
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "M01/PROYECTO/1.4"
          dotnet restore AceriaData.sln
          dotnet build AceriaData.sln --configuration Release

          $list = dotnet ef migrations list --project AceriaData.Console/AceriaData.Console.csproj
          foreach ($name in @("InitialCreate","AddAleacion","AddEstadoOrden")) {
              if (($list -join "`n") -notmatch $name) { throw "Checkpoint 1.4 no contiene $name." }
          }

          dotnet ef database drop --force --project AceriaData.Console/AceriaData.Console.csproj
          dotnet ef database update --project AceriaData.Console/AceriaData.Console.csproj

          $output = dotnet run --project AceriaData.Console/AceriaData.Console.csproj --configuration Release
          foreach ($entity in @("OrdenFabricacion","PlanchaAcero","Aleacion","EstadoOrden")) {
              if (($output -join "`n") -notmatch $entity) { throw "Checkpoint 1.4 no muestra $entity." }
          }

      - name: Subir 1.4 reconstruido
        uses: actions/upload-artifact@v4
        with:
          name: m01-1.4-reconstruido
          path: ${{ runner.temp }}/e2e-m01-1.4
          if-no-files-found: error


  m01_1_5:
