                  using (var context = AceriaDbContextFactory.Create())
                  {
                      var ordenes = context.OrdenesFabricacion.ToList();
                      context.OrdenesFabricacion.RemoveRange(ordenes);
                      Console.WriteLine($"RemoveRange marca: {context.ChangeTracker.Entries().Count(e => e.State == EntityState.Deleted)}");
                      context.SaveChanges();
                      Console.WriteLine($"Restantes: {context.OrdenesFabricacion.Count()}");
                  }
              }
