                      context.Database.EnsureDeleted();
                      context.Database.Migrate();

                      context.OrdenesFabricacion.AddRange(
                          new OrdenFabricacion { NumeroOrden = "OF-R1", Cliente = "A", FechaCreacion = DateTime.Now },
                          new OrdenFabricacion { NumeroOrden = "OF-R2", Cliente = "B", FechaCreacion = DateTime.Now });
