name: Preview PDF práctica M05

on:
  workflow_dispatch:
  push:
    branches:
      - fix/revision-editorial-pdfs-m02-m05
    paths:
      - M05/PRACTICA/M05_PRACTICA.md
      - .github/scripts/build_m05_practica_preview.py
      - .github/workflows/m05-practica-preview-temporal.yml

permissions:
  contents: write

concurrency:
  group: revision-editorial-pdfs-m05
  cancel-in-progress: true

# Reconstrucción canónica de prácticas M05.
jobs:
  preview:
    name: M05 · PDF canónico + previews 5.1–5.12
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar motor PDF y renderizador
        run: |
          python -m pip install --upgrade pip
          pip install mistune pygments weasyprint
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generar PDF oficial y previews desde la práctica canónica
        run: |
          python .github/scripts/build_m05_practica_preview.py
          pdfinfo M05/PRACTICA/M05_PRACTICA.pdf
          for point in 5.1 5.2 5.3 5.4 5.5 5.6 5.7 5.8 5.9 5.10 5.11 5.12; do
            pdfinfo "M05/PRACTICA/_preview/M05_PRACTICA_${point}_PREVIEW.pdf"
          done

      - name: Validar cobertura textual canónica
        shell: bash
        run: |
          pdftotext M05/PRACTICA/M05_PRACTICA.pdf /tmp/m05-practica.txt
          for point in 5.1 5.2 5.3 5.4 5.5 5.6 5.7 5.8 5.9 5.10 5.11 5.12; do
            grep -Fq "Punto ${point}" /tmp/m05-practica.txt || exit 1
          done
          test "$(grep -c 'Reto resuelto' /tmp/m05-practica.txt)" -ge 12
          test "$(grep -c 'Resultado esperado' /tmp/m05-practica.txt)" -ge 12
          echo "M05 PDF: 5.1-5.12 + 12 RETOS + RESULTADOS PRESENTES"

      - name: Renderizar previews para revisión visual
        shell: bash
        run: |
          mkdir -p M05/PRACTICA/_preview
          rm -f M05/PRACTICA/_preview/p4*.png
          for point in 5.1 5.2 5.3 5.4 5.5 5.6 5.7 5.8 5.9 5.10 5.11 5.12; do
            suffix="${point//./}"
            pdftoppm -png -r 110               "M05/PRACTICA/_preview/M05_PRACTICA_${point}_PREVIEW.pdf"               "M05/PRACTICA/_preview/p${suffix}"
          done

      - name: Publicar PDF oficial y previews en la rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A M05/PRACTICA/_preview/ M05/PRACTICA/M05_PRACTICA.pdf
          if git diff --cached --quiet; then
            echo "PDF y previews sin cambios."
          else
            git commit -m "docs(m5): actualizar PDF canónico y previews"
            git push
          fi