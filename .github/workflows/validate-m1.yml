name: Validate M1

on:
  push:
    branches: [ main ]
    paths:
      - 'M01/**'
      - 'scripts/audit_m1_traceability.py'
      - 'scripts/audit_pdf_pages.py'
      - 'scripts/generate_pdfs.py'
      - '.github/workflows/validate-m1.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'M01/**'
      - 'scripts/audit_m1_traceability.py'
      - 'scripts/audit_pdf_pages.py'
      - 'scripts/generate_pdfs.py'
      - '.github/workflows/validate-m1.yml'
  workflow_dispatch:

concurrency:
  group: validate-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-m1:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize cumulative project states from practice
        shell: pwsh
        run: |
          python scripts/sync_m1_project_states.py
          $changes = git status --porcelain -- M01/PROYECTO/1.5 M01/PROYECTO/1.6 M01/PROYECTO/1.7 M01/PROYECTO/1.8 M01/PROYECTO/1.9 M01/PROYECTO/1.10
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add M01/PROYECTO/1.5/Program.cs M01/PROYECTO/1.6/Program.cs M01/PROYECTO/1.7/Program.cs M01/PROYECTO/1.8/Program.cs M01/PROYECTO/1.9/Program.cs M01/PROYECTO/1.10/Program.cs
            git commit -m "build: sincronizar estados acumulativos M1 con práctica [skip ci]"
            git push
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ensure SQL Server LocalDB
        shell: pwsh
        run: |
          $instances = @(sqllocaldb info)
          if ($instances -notcontains 'MSSQLLocalDB') {
            sqllocaldb create MSSQLLocalDB
          }
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore final solution
        working-directory: M01/PROYECTO/1.12
        run: dotnet restore AceriaData.sln

      - name: Build final solution
        working-directory: M01/PROYECTO/1.12
        run: dotnet build AceriaData.sln --configuration Release --no-restore

      - name: Install EF Core CLI 8
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.31
          dotnet ef --version

      - name: Validate migrations
        working-directory: M01/PROYECTO/1.12
        run: |
          dotnet ef migrations list --no-build --configuration Release
          dotnet ef migrations script --no-build --configuration Release --output migrations.sql
          dotnet ef database update --no-build --configuration Release

      - name: Run final AceriaData end-to-end
        shell: pwsh
        working-directory: M01/PROYECTO/1.12
        run: |
          $output = dotnet run --no-build --configuration Release 2>&1 | Out-String
          $output
          @(
            'OF-001',
            'OF-002',
            'Constructora del Oeste',
            'OF-003 eliminada',
            'Orden 999 no encontrada'
          ) | ForEach-Object {
            if ($output -notmatch [regex]::Escape($_)) {
              throw "No se encontró la evidencia E2E esperada: $_"
            }
          }

      - name: Build all cumulative M1 solutions
        shell: pwsh
        run: |
          1..12 | ForEach-Object {
            $point = "1.$_"
            $solution = Join-Path "M01/PROYECTO/$point" 'AceriaData.sln'
            Write-Host "== Building M01/PROYECTO/$point/AceriaData.sln =="
            dotnet restore $solution
            dotnet build $solution --configuration Release --no-restore
          }

      - name: Run all cumulative M1 project states
        shell: pwsh
        run: |
          1..12 | ForEach-Object {
            $point = "1.$_"
            $project = Join-Path "M01/PROYECTO/$point" 'AceriaData.Console.csproj'
            Write-Host "== Running M01/PROYECTO/$point =="
            dotnet run --project $project --configuration Release --no-build
          }

      - name: Audit practice-to-code traceability and practice E2E
        run: python scripts/audit_m1_traceability.py

      - name: Validate documentation structure
        shell: pwsh
        run: |
          $theory = Get-Content M01/TEORIA/M01_TEORIA.md -Raw
          $practice = Get-Content M01/PRACTICA/M01_PRACTICA.md -Raw
          $theoryPoints = ([regex]::Matches($theory, '(?m)^## Punto 1\.\d+')).Count
          $practicePoints = ([regex]::Matches($practice, '(?m)^## Punto 1\.\d+')).Count
          if ($theoryPoints -ne 12) { throw "Teoría: se esperaban 12 puntos y hay $theoryPoints" }
          if ($practicePoints -ne 12) { throw "Práctica: se esperaban 12 puntos y hay $practicePoints" }
          @('The user says','Let me develop','Esperando confirmación para continuar') | ForEach-Object {
            if ($theory.Contains($_) -or $practice.Contains($_)) { throw "Metacontenido conversacional detectado: $_" }
          }
          $source = Get-ChildItem M01/PROYECTO -Recurse -File | Get-Content -Raw
          if ($source -match 'UseSqlite\(' -or $source -match 'UseNpgsql\(' -or $source -match 'UseInMemoryDatabase\(') {
            throw 'Proveedor alternativo ejecutable detectado fuera del futuro punto 5.10.'
          }

  publish-pdfs:
    needs: validate-m1
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: pip install mistune beautifulsoup4 pygments weasyprint pypdf pymupdf pymupdf

      - name: Generate PDFs
        run: python scripts/generate_pdfs.py

      - name: Audit every PDF page
        run: python scripts/audit_pdf_pages.py

      - name: Upload PDFs for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: M01-PDF-QA
          path: |
            M01/TEORIA/M01_TEORIA.pdf
            M01/PRACTICA/M01_PRACTICA.pdf
          if-no-files-found: error
          retention-days: 3

      - name: Commit PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M01/TEORIA/M01_TEORIA.pdf M01/PRACTICA/M01_PRACTICA.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged."
            exit 0
          fi
          git commit -m "docs: publicar PDFs validados de M1"
          git push
