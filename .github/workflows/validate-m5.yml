name: Validate M5

on:
  push:
    branches: [ m5-build-strict ]
    paths:
      - 'M05/**'
      - 'scripts/*m5*.py'
      - '.github/workflows/validate-m5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-m5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-m5-code:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF CLI
        shell: pwsh
        run: dotnet tool install --global dotnet-ef --version 8.0.31

      - name: Restore and build existing M5 checkpoints
        shell: pwsh
        run: |
          foreach ($n in 1..10) {
            $d = "M05/PROYECTO/5.$n"
            Write-Host "== BUILD 5.$n =="
            dotnet restore "$d/AceriaData.sln"
            dotnet build "$d/AceriaData.sln" --configuration Release --no-restore
          }

      - name: Generate the real 5.2 migration when absent
        shell: pwsh
        working-directory: M05/PROYECTO/5.2
        run: |
          $existing = Get-ChildItem src/AceriaData.Infrastructure/Migrations -Filter '*_M5_5_2_ConcurrencyTokens.cs' -ErrorAction SilentlyContinue
          if (-not $existing) {
            dotnet ef migrations add M5_5_2_ConcurrencyTokens --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          } else {
            Write-Host '5.2 migration already present'
          }

      - name: Validate 5.1 inherited migration chain
        shell: pwsh
        working-directory: M05/PROYECTO/5.1
        run: |
          $list = dotnet ef migrations list --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release | Out-String
          $list
          if ($list -notmatch 'M2_2_12_Architecture') {
            throw '5.1 no conserva la migracion final heredada de M4'
          }

      - name: Validate and apply 5.2 migration chain
        shell: pwsh
        working-directory: M05/PROYECTO/5.2
        run: |
          $list = dotnet ef migrations list --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release | Out-String
          $list
          if ($list -notmatch 'M5_5_2_ConcurrencyTokens') {
            throw '5.2 no contiene la migracion real de tokens'
          }
          dotnet ef database update --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release

      - name: Run 5.1 against SQL Server LocalDB
        shell: pwsh
        run: |
          $output = dotnet run --project M05/PROYECTO/5.1/src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.1 OK') { throw 'Falta marcador 5.1 OK' }
          if ($output -notmatch 'Se perdió el cambio de A\?: True') { throw '5.1 no demuestra la perdida sobre la misma propiedad' }
          if ($output -notmatch 'Se conservaron ambos cambios\?: True') { throw '5.1 no demuestra el tracking por propiedad' }

      - name: Run 5.2 against SQL Server LocalDB
        shell: pwsh
        run: |
          dotnet build M05/PROYECTO/5.2/AceriaData.sln --configuration Release
          $output = dotnet run --project M05/PROYECTO/5.2/src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.2 OK') { throw 'Falta marcador 5.2 OK' }
          if ($output -notmatch 'Conflicto detectado con rowversion\?: True') { throw 'rowversion no detecto el conflicto' }
          if ($output -notmatch 'Conflicto detectado con token de propiedad\?: True') { throw 'IsConcurrencyToken no detecto el conflicto' }
          if ($output -notmatch 'índice sobre RowVersion\?: False') { throw 'No se verifico la ausencia de indice automatico' }
          if ($output -notmatch 'RowVersion') { throw 'El SQL observado no muestra RowVersion' }
          if ($output -notmatch 'EstadoDetalle') { throw 'El SQL observado no muestra EstadoDetalle' }

      - name: Validate 5.3 has no pending model changes
        shell: pwsh
        working-directory: M05/PROYECTO/5.3
        run: |
          $list = dotnet ef migrations list --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release | Out-String
          $list
          if ($list -notmatch 'M5_5_2_ConcurrencyTokens') { throw '5.3 no hereda la migracion de 5.2' }
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release

      - name: Run 5.3 against SQL Server LocalDB
        shell: pwsh
        run: |
          $output = dotnet run --project M05/PROYECTO/5.3/src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.3 OK') { throw 'Falta marcador 5.3 OK' }
          if ($output -notmatch 'Cliente final: Cliente B - cliente gana') { throw 'Cliente gana no prevalecio' }
          if ($output -notmatch 'Cliente final: Cliente A - base gana') { throw 'Base de datos gana no prevalecio' }
          if ($output -notmatch 'Cliente final: Cliente B - merge') { throw 'Merge no conservo Cliente local' }
          if ($output -notmatch 'Estado final: EnProceso A') { throw 'Merge no conservo Estado de BD' }
          if ($output -notmatch 'GetDatabaseValues confirmó que ya no existe\?: True') { throw 'No se detecto la fila eliminada' }
          if ($output -notmatch 'Entrada desacoplada\?: True') { throw 'No se desacoplo la entrada eliminada' }
          if ($output -notmatch 'Intentos de guardado: 2') { throw 'No se verifico el reintento acotado' }

      - name: Validate 5.4 model and SQL Server savepoint prerequisites
        shell: pwsh
        working-directory: M05/PROYECTO/5.4
        run: |
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          $settings = Get-Content src/AceriaData.Console/appsettings.json -Raw
          if ($settings -notmatch 'MultipleActiveResultSets=false') {
            throw '5.4 debe ejecutar los savepoints con MARS desactivado'
          }
          $transactionCode = Get-Content src/AceriaData.Infrastructure/Repositories/TransaccionesM5Repositorio.cs -Raw
          if ($transactionCode -match 'ReleaseSavepoint') {
            throw '5.4 no debe presentar ReleaseSavepoint como operacion SQL Server necesaria'
          }

      - name: Run 5.4 against SQL Server LocalDB
        shell: pwsh
        run: |
          $output = dotnet run --project M05/PROYECTO/5.4/src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.4 OK') { throw 'Falta marcador 5.4 OK' }
          if ($output -notmatch 'Atomicidad de un único SaveChanges') { throw 'No se ejecuto la prueba atomica' }
          if ($output -notmatch 'Transacción explícita con Commit') { throw 'No se ejecuto Commit' }
          if ($output -notmatch 'Transacción explícita con Rollback') { throw 'No se ejecuto Rollback' }
          if ($output -notmatch 'Rollback a savepoint') { throw 'No se ejecuto RollbackToSavepoint' }
          if ($output -notmatch 'MARS habilitado: False') { throw '5.4 no demostro MARS desactivado' }
          if ($output -notmatch 'Primera orden existe: True') { throw 'No se verifico persistencia antes del savepoint/commit' }
          if ($output -notmatch 'Segunda orden existe: False') { throw 'No se verifico rollback parcial/atomico' }

      - name: Validate 5.5 model and TransactionScope guardrails
        shell: pwsh
        working-directory: M05/PROYECTO/5.5
        run: |
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          $ambientCode = Get-Content src/AceriaData.Infrastructure/Repositories/TransaccionesAmbientalesM5Repositorio.cs -Raw
          if ($ambientCode -match 'BeginTransaction\(') {
            throw '5.5 no debe crear una transaccion explicita interna dentro de TransactionScope'
          }
          if ($ambientCode -notmatch 'TransactionScopeAsyncFlowOption.Enabled') {
            throw '5.5 debe habilitar el flujo async de TransactionScope'
          }
          if ($ambientCode -notmatch 'DistributedIdentifier') {
            throw '5.5 debe comprobar si hubo promocion distribuida'
          }

      - name: Run 5.5 against SQL Server LocalDB
        shell: pwsh
        run: |
          $output = dotnet run --project M05/PROYECTO/5.5/src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.5 OK') { throw 'Falta marcador 5.5 OK' }
          if ($output -notmatch 'Dos DbContext con una conexión compartida') { throw 'No se ejecuto el escenario multi-contexto' }
          if ($output -notmatch 'Flujo async conservado: True') { throw 'TransactionScope no fluyo a traves de await' }
          if ($output -notmatch 'Promoción distribuida: False') { throw 'El laboratorio 5.5 se promovio a DTC' }
          if ($output -notmatch 'Scope sin Complete') { throw 'No se ejecuto el rollback por omision de Complete' }
          if ($output -notmatch 'Required reutiliza la transacción: True') { throw 'Required no reutilizo el ambiente' }
          if ($output -notmatch 'RequiresNew crea otra transacción: True') { throw 'RequiresNew no creo otra transaccion' }
          if ($output -notmatch 'Suppress elimina la transacción ambiental: True') { throw 'Suppress no suprimio el ambiente' }
          if ($output -notmatch 'Fila de base de datos persistida: False') { throw 'El scope fallido no revirtio SQL' }
          if ($output -notmatch 'Efecto externo permanece: True') { throw 'No se demostro el recurso externo no transaccional' }
          if ($output -notmatch 'Observado: ReadCommitted') { throw 'No se observo ReadCommitted' }
          if ($output -notmatch 'Observado: Snapshot') { throw 'No se observo Snapshot' }

      - name: Validate 5.6 production migration guardrails
        shell: pwsh
        working-directory: M05/PROYECTO/5.6
        run: |
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          $program = Get-Content src/AceriaData.Console/Program.cs -Raw
          if ($program -match 'Database\.Migrate\(') {
            throw '5.6 no debe usar Database.Migrate como estrategia de arranque'
          }
          if ($program -match 'EnsureCreated') {
            throw '5.6 no debe usar EnsureCreated'
          }
          $di = Get-Content src/AceriaData.Infrastructure/DependencyInjection.cs -Raw
          if ($di -notmatch 'MigrationsAssembly') { throw 'Falta MigrationsAssembly' }
          if ($di -match 'MigrationsHistoryTable') { throw '5.6 no debe cambiar la tabla de historial de una base ya heredada sin migrar el historial existente' }

      - name: Run 5.6 with IMigrator against SQL Server LocalDB
        shell: pwsh
        run: |
          $output = dotnet run --project M05/PROYECTO/5.6/src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.6 OK') { throw 'Falta marcador 5.6 OK' }
          if ($output -notmatch 'Migraciones pendientes después de IMigrator: 0') { throw 'IMigrator dejo migraciones pendientes' }
          if ($output -notmatch 'M5_5_2_ConcurrencyTokens') { throw 'No se alcanzo la migracion final' }
          if ($output -notmatch 'Tabla de historial: __EFMigrationsHistory') { throw '5.6 no conservo el historial heredado' }
          if ($output -notmatch 'Tabla de historial heredada existe: True') { throw 'No existe el historial heredado' }

      - name: Generate 5.6 production deployment artifacts
        shell: pwsh
        working-directory: M05/PROYECTO/5.6
        run: |
          ./deployment/generate-production-artifacts.ps1
          $sql = Get-Content deployment/artifacts/aceria-idempotent.sql -Raw
          if ($sql -notmatch '__EFMigrationsHistory') { throw 'El script no conserva el historial heredado' }
          if ($sql -notmatch 'IF NOT EXISTS') { throw 'El script no parece idempotente' }
          if ($sql -notmatch 'M5_5_2_ConcurrencyTokens') { throw 'El script no contiene la migracion final' }
          if (-not (Test-Path deployment/artifacts/aceria-efbundle.exe)) { throw 'No se genero el migration bundle' }

      - name: Execute 5.6 migration bundle on an isolated LocalDB
        shell: pwsh
        working-directory: M05/PROYECTO/5.6
        run: |
          $connection = 'Server=(localdb)\MSSQLLocalDB;Database=AceriaDB_M5_6_Bundle;Trusted_Connection=True;TrustServerCertificate=True;MultipleActiveResultSets=false;Connect Timeout=30;'
          & ./deployment/artifacts/aceria-efbundle.exe --connection $connection
          if ($LASTEXITCODE -ne 0) { throw 'El bundle fallo en una base limpia' }
          & ./deployment/artifacts/aceria-efbundle.exe --connection $connection
          if ($LASTEXITCODE -ne 0) { throw 'El bundle fallo al ejecutarse por segunda vez' }

      - name: Validate 5.7 model and idempotent SQL scripts
        shell: pwsh
        working-directory: M05/PROYECTO/5.7
        run: |
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          $output = dotnet run --project src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.7 OK') { throw 'Falta marcador 5.7 OK' }
          ./deployment/validate-idempotent-scripts.ps1

      - name: Validate 5.8 team migration workflow
        shell: pwsh
        working-directory: M05/PROYECTO/5.8
        run: |
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          $output = dotnet run --project src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.8 OK') { throw 'Falta marcador 5.8 OK' }
          ./team-migrations/validate-team-migrations.ps1

      - name: Validate 5.9 Repository and Unit of Work
        shell: pwsh
        working-directory: M05/PROYECTO/5.9
        run: |
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          $output = dotnet run --project src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.9 OK') { throw 'Falta marcador 5.9 OK' }
          if ($output -notmatch 'Orden creada y recuperada: True') { throw 'UoW no persistio la orden' }
          if ($output -notmatch 'Detalle creado y recuperado: True') { throw 'UoW no persistio el detalle' }
          if ($output -notmatch 'Resultados equivalentes: True') { throw 'Repository y acceso directo no dieron resultados equivalentes' }
          if ($output -notmatch 'IDbContextFactory crea contextos distintos: True') { throw 'IDbContextFactory no creo contextos independientes' }
          if ($output -notmatch 'No se atribuye un coste fijo') { throw 'Falta la correccion del benchmark no controlado' }
          dotnet test tests/AceriaData.Tests/AceriaData.Tests.csproj --configuration Release --no-build

      - name: Validate 5.10 logging and diagnostics
        shell: pwsh
        working-directory: M05/PROYECTO/5.10
        run: |
          dotnet ef migrations has-pending-model-changes --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release
          $output = dotnet run --project src/AceriaData.Console/AceriaData.Console.csproj --configuration Release --no-build | Out-String
          $output
          if ($output -notmatch '5\.10 OK') { throw 'Falta marcador 5.10 OK' }
          if ($output -notmatch '5\.10 DIAGNOSTIC EVENTS: [1-9]') { throw 'No hay evidencia de DiagnosticSource' }
          if ($output -notmatch '5\.10 EVENT COUNTERS: [1-9]') { throw 'No hay evidencia de EventCounters' }
          if ($output -notmatch '5\.10 TELEMETRY ITEMS: [1-9]') { throw 'No hay evidencia de Application Insights' }
          $logs = Get-ChildItem src/AceriaData.Console/bin/Release/net8.0/logs -Filter 'aceria-*.log'
          if ($logs.Count -lt 2 -or $logs.Count -gt 3) { throw "Rotacion/retencion de logs invalida: $($logs.Count)" }

      - name: Verify architecture boundary
        shell: pwsh
        run: |
          foreach ($n in 1..10) {
            $app = Get-ChildItem "M05/PROYECTO/5.$n/src/AceriaData.Application" -Filter *.cs | Get-Content -Raw
            if ($app -match 'Microsoft.EntityFrameworkCore') {
              throw "Application de 5.$n depende de EF Core"
            }
            if ($app -match 'AceriaData.Infrastructure') {
              throw "Application de 5.$n depende de Infrastructure"
            }
          }

      - name: Publish generated 5.2 migration
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M05/PROYECTO/5.2/src/AceriaData.Infrastructure/Migrations
          if git diff --cached --quiet; then
            echo "No generated migration changes to publish"
          else
            git commit -m "db(m5): generar migracion EF Core real para 5.2"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
