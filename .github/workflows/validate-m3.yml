name: Validate M3

on:
  push:
    branches: [ main ]
    paths:
      - 'M03/**'
      - 'scripts/audit_m3_traceability.py'
      - 'scripts/generate_m3_pdfs.py'
      - 'scripts/audit_m3_pdf_pages.py'
      - '.github/workflows/validate-m3.yml'
  workflow_dispatch:

concurrency:
  group: validate-m3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-m3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF CLI
        shell: pwsh
        run: dotnet tool install --global dotnet-ef --version 8.0.31

      - name: Audit cumulative structure and traceability
        run: python scripts/audit_m3_traceability.py

      - name: Restore and build all M3 checkpoints
        shell: pwsh
        run: |
          foreach ($n in 1..12) {
            $d = "M03/PROYECTO/3.$n"
            Write-Host "== BUILD 3.$n =="
            dotnet restore "$d/AceriaData.sln"
            dotnet build "$d/AceriaData.sln" --configuration Release --no-restore
          }

      - name: Validate inherited migration chain
        shell: pwsh
        working-directory: M03/PROYECTO/3.12
        run: |
          $list = dotnet ef migrations list --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release | Out-String
          $list
          if ($list -notmatch 'M2_2_12_Architecture') { throw 'M3 no conserva la migración final de M2' }
          dotnet ef database update --project src/AceriaData.Infrastructure --startup-project src/AceriaData.Console --configuration Release

      - name: Run every checkpoint E2E against LocalDB
        shell: pwsh
        run: |
          foreach ($n in 1..12) {
            $d = "M03/PROYECTO/3.$n"
            Write-Host "== RUN 3.$n =="
            $output = dotnet run --project "$d/src/AceriaData.Console/AceriaData.Console.csproj" --configuration Release --no-build | Out-String
            $output
            if ($output -notmatch "3\.$n OK") { throw "Falta marcador E2E 3.$n OK" }
          }

      - name: Verify final architecture boundary
        shell: pwsh
        run: |
          $interfaces = Get-Content M03/PROYECTO/3.12/src/AceriaData.Application/Interfaces.cs -Raw
          if ($interfaces -match 'IQueryable<OrdenFabricacion>') { throw '3.12 sigue exponiendo IQueryable' }
          $app = Get-ChildItem M03/PROYECTO/3.12/src/AceriaData.Application -Filter *.cs | Get-Content -Raw
          if ($app -match 'Microsoft.EntityFrameworkCore') { throw 'Application depende de EF Core' }

  publish-m3-pdfs:
    needs: validate-m3
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: pip install mistune beautifulsoup4 pygments weasyprint pypdf pymupdf
      - name: Generate M3 PDFs
        run: python scripts/generate_m3_pdfs.py
      - name: Audit every M3 PDF page
        run: python scripts/audit_m3_pdf_pages.py
      - name: Upload PDFs for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: M03-PDF-QA
          path: |
            M03/TEORIA/M03_TEORIA.pdf
            M03/PRACTICA/M03_PRACTICA.pdf
          if-no-files-found: error
          retention-days: 3
      - name: Commit validated M3 PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M03/TEORIA/M03_TEORIA.pdf M03/PRACTICA/M03_PRACTICA.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged."
            exit 0
          fi
          git commit -m "docs: publicar PDFs validados de M3"
          git pull --rebase
          git push
