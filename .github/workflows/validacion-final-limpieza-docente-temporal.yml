name: Validación final limpieza docente

on:
  push:
    branches:
      - final/limpieza-docente
  workflow_dispatch:

jobs:
  build-all-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar todos los checkpoints M01-M05
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t solutions < <(find M01/PROYECTO M02/PROYECTO M03/PROYECTO M04/PROYECTO M05/PROYECTO -name 'AceriaData.sln' -type f | sort -V)
          echo "Soluciones encontradas: ${#solutions[@]}"
          if [ "${#solutions[@]}" -ne 60 ]; then
            echo "Se esperaban 60 soluciones (12 checkpoints x 5 módulos)."
            printf '%s\n' "${solutions[@]}"
            exit 1
          fi
          for sln in "${solutions[@]}"; do
            echo "::group::BUILD $sln"
            dotnet restore "$sln"
            dotnet build "$sln" --configuration Release --no-restore --nologo
            echo "::endgroup::"
          done

      - name: Confirmar ausencia de artefactos internos
        shell: bash
        run: |
          set -euo pipefail
          if find M01/PROYECTO M02/PROYECTO M03/PROYECTO M04/PROYECTO M05/PROYECTO \
              \( -name 'CanonicalPdfBlocks.cs' -o -name 'CANONICAL_PDF_SUPPORT.md' -o -name '*PRACTICA_CANONICA*' \) -print | grep -q .; then
            echo "Quedan artefactos internos."
            exit 1
          fi
          pattern='CANONICAL|PRACTICA_CANONICA|FRAGMENTO PDF|COPIA PEDAGÓGICA EXACTA|El E2E|E2E de Soft Delete|ACTIVO FINAL M0|BLOQUE PEDAGÓGICO ACTIVABLE DEL PDF|SOURCE TARGET:|ACTIVATION:|blob fuente|La auditoría comprueba|CORRECCIÓN TÉCNICA MÍNIMA'
          if grep -RInE "$pattern" --include='*.cs' --include='*.md' --exclude-dir=bin --exclude-dir=obj               M01/PROYECTO M02/PROYECTO M03/PROYECTO M04/PROYECTO M05/PROYECTO; then
            echo "Quedan marcadores internos."
            exit 1
          fi
          echo "PASS: árbol docente limpio y compilado."
