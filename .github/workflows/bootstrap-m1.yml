name: Bootstrap M1

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bootstrap-m1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir el Modulo 1
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/M1_REPO_PAYLOAD_BASE64.txt > /tmp/m1_textrepo.tar.gz
          tar -xzf /tmp/m1_textrepo.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-m1.yml

      - name: Publicar contenido reconstruido
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "feat: publicar M1 separado, trazado y validable"
          git push origin HEAD:main
