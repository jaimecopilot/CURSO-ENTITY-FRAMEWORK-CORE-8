name: Limpieza docente temporal

on:
  push:
    branches:
      - final/limpieza-docente
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ausencia de artefactos internos
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          echo "== Ficheros internos =="
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "NO DEBE ESTAR: $f"
            fail=1
          done < <(find M01/PROYECTO M02/PROYECTO M03/PROYECTO M04/PROYECTO M05/PROYECTO \
            \( -name 'CanonicalPdfBlocks.cs' -o -name 'CANONICAL_PDF_SUPPORT.md' -o -name '*PRACTICA_CANONICA*' \) -print)

          echo "== Marcadores internos =="
          pattern='CANONICAL|PRACTICA_CANONICA|FRAGMENTO PDF|COPIA PEDAGÓGICA EXACTA|El E2E|E2E de Soft Delete|ACTIVO FINAL M0|BLOQUE PEDAGÓGICO ACTIVABLE DEL PDF|SOURCE TARGET:|ACTIVATION:|blob fuente|La auditoría comprueba|CORRECCIÓN TÉCNICA MÍNIMA'
          if grep -RInE "$pattern" \
            --include='*.cs' --include='*.md' \
            --exclude-dir=bin --exclude-dir=obj \
            M01/PROYECTO M02/PROYECTO M03/PROYECTO M04/PROYECTO M05/PROYECTO; then
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "FAIL: quedan artefactos o marcadores internos."
            exit 1
          fi

          echo "PASS: árbol docente limpio."
