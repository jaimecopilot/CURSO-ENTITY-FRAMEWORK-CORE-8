name: E2E pedagógico M05 tail

on:
  push:
    branches:
      - fix/e2e-pedagogico-m05
    paths:
      - .github/workflows/e2e-pedagogico-m05-tail-temporal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m05-tail-fix-e2e-pedagogico-m05
  cancel-in-progress: true

jobs:
  m05_tail:
    name: M05 · 5.10–5.12 · validación dirigida
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Preparar EF Core 8 y SQL Server LocalDB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool update --global dotnet-ef --version 8.0.31
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global dotnet-ef --version 8.0.31
          }
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw "No se pudo iniciar SQL Server LocalDB." }

      - name: Validar 5.10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./.github/scripts/Test-M05.ps1 -Suite 5.10

      - name: Validar 5.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./.github/scripts/Test-M05.ps1 -Suite 5.11

      - name: Validar 5.12
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./.github/scripts/Test-M05.ps1 -Suite 5.12
